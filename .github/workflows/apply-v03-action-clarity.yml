name: Apply v0.3 Action Clarity

on:
  push:
    branches:
      - feature/v0.3-action-clarity
    paths:
      - scripts/apply_v03_action_clarity.py
      - .github/workflows/apply-v03-action-clarity.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3-action-clarity
      - name: Apply migration
        run: python scripts/apply_v03_action_clarity.py
      - name: Validate JSON
        run: python -m json.tool game.json >/dev/null
      - name: Static assertions
        run: |
          python - <<'PY'
          import json
          d=json.load(open('game.json',encoding='utf-8'))
          l=next(x for x in d['layouts'] if x['name']=='FROST LAB')
          names={o['name'] for o in l['objects']}
          assert {'StatusText','ActionFeedbackText'} <= names
          assert any(e.get('name')=='v0.3 Action clarity feedback' for e in l['events'])
          print('static validation PASS')
          PY
      - name: Commit generated game.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.json
          if git diff --cached --quiet; then
            echo "No game.json changes"
            exit 0
          fi
          git commit -m "feat: apply v0.3 action clarity update"
          git push
