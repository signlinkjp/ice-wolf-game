name: v0.6.5 Improvements Once

on:
  push:
    branches:
      - feature/v065-production-round-start
    paths:
      - .github/workflows/v065-improvements-ci.yml

permissions:
  contents: write

jobs:
  run:
    if: ${{ !contains(github.event.head_commit.message, 'remove v0.6.5 improvements ci helper') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v065-production-round-start
          fetch-depth: 0
      - name: Run v0.6.5 improvement verification and preview publish
        run: bash scripts/v065/run-v065-improvements-ci.sh

