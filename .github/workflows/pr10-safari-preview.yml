name: PR10 Safari Diagnostic Preview

on:
  push:
    branches:
      - feature/v060-human-side-cpu-wolf
    paths:
      - '.github/workflows/pr10-safari-preview.yml'

permissions:
  contents: write

jobs:
  export-and-publish-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR10 feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v060-human-side-cpu-wolf
          fetch-depth: 0

      - name: Confirm approved baseline and diagnostic project
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = '84bbfe11f8f345addf3762cc277429b560cc4194'
          test "$(git merge-base HEAD origin/main)" = '84bbfe11f8f345addf3762cc277429b560cc4194'
          python - <<'PY'
          import json
          with open('game.json', encoding='utf-8') as f:
              data = json.load(f)
          frost = next(x for x in data['layouts'] if x.get('name') == 'FROST LAB')
          assert next(o for o in frost['objects'] if o.get('name') == 'BuildText')['string'] == '開発版 v0.6.0-DIAG'
          assert next(o for o in frost['objects'] if o.get('name') == 'CpuWolfTestButton')['string'] == 'CPU人狼テスト'
          assert any(t.get('name') == 'v0.6.0 CPU Wolf device diagnostic test' for t in data['tests'])
          assert sum(1 for i in frost['instances'] if i.get('name') == 'Actor') == 6
          print('PR10 diagnostic project invariant PASS')
          PY

      - name: Install GDevelop Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libasound2t64 xvfb unzip curl

      - name: Download exact GDevelop 5.6.282 portable build
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            'https://github.com/4ian/GDevelop/releases/download/v5.6.282/GDevelop-5-5.6.282-linux.zip' \
            --output /tmp/gdevelop.zip
          echo 'c1d23616562befbde242412913785dacb0bb15a79e8c101c1553dc729b1e0472  /tmp/gdevelop.zip' | sha256sum -c -
          mkdir -p /tmp/gdevelop
          unzip -q /tmp/gdevelop.zip -d /tmp/gdevelop
          BIN="$(find /tmp/gdevelop -type f -name gdevelop -perm -u+x | head -n 1)"
          if [ -z "$BIN" ]; then
            BIN="$(find /tmp/gdevelop -type f -name gdevelop | head -n 1)"
          fi
          test -n "$BIN"
          chmod +x "$BIN"
          echo "GDEVELOP_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Export validated diagnostic project to HTML5
        shell: bash
        run: |
          rm -rf build /tmp/ice-wolf-pr10-preview
          xvfb-run -a "$GDEVELOP_BIN" \
            --no-sandbox \
            --disable-update-check \
            --run-command EXPORT_HTML5_EXTERNAL "$GITHUB_WORKSPACE/game.json"
          test -s build/index.html
          test "$(find build -type f | wc -l)" -gt 5
          cp -a build /tmp/ice-wolf-pr10-preview
          printf '%s\n' "source_feature_head=$(git rev-parse HEAD)" > /tmp/ice-wolf-pr10-preview/PREVIEW_SOURCE.txt
          printf '%s\n' "base_main=84bbfe11f8f345addf3762cc277429b560cc4194" >> /tmp/ice-wolf-pr10-preview/PREVIEW_SOURCE.txt
          printf '%s\n' "build=ICE WOLF v0.6.0-DIAG" >> /tmp/ice-wolf-pr10-preview/PREVIEW_SOURCE.txt

      - name: Publish isolated preview branch
        shell: bash
        run: |
          git config user.name 'signlinkjp'
          git config user.email 'signlink.support@gmail.com'
          git switch --orphan preview-pr10-cpu-wolf-diag
          git rm -rf . >/dev/null 2>&1 || true
          rm -rf .github README.md assets game.json seed build || true
          cp -a /tmp/ice-wolf-pr10-preview/. .
          touch .nojekyll
          git add -A
          git commit -m 'preview: PR10 CPU wolf Safari diagnostic'
          git push --force-with-lease origin HEAD:preview-pr10-cpu-wolf-diag
          echo "PREVIEW_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Preview summary
        run: |
          echo "Preview branch: preview-pr10-cpu-wolf-diag"
          echo "Preview SHA: $PREVIEW_HEAD"
          echo "Development URL: https://raw.githack.com/signlinkjp/ice-wolf-game/preview-pr10-cpu-wolf-diag/index.html"
