name: v0.6.5 Preview Refresh

on:
  push:
    branches:
      - feature/v065-production-round-start
    paths:
      - .github/workflows/v065-preview-refresh.yml

permissions:
  contents: write

jobs:
  validate-export-refresh-cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'remove v0.6.5 preview refresh helper') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: 9c24143327abfb2bdd9a6a9b0d13cd2f1422eea1
      EXPECTED_FEATURE_HEAD: 1e92675464a9d0ac59eaae245516610e8e6356a9
      FEATURE_BRANCH: feature/v065-production-round-start
      PREVIEW_BRANCH: preview-v065-production-round-start
      GDEVELOP_SHA256: c1d23616562befbde242412913785dacb0bb15a79e8c101c1553dc729b1e0472
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v065-production-round-start
          fetch-depth: 0

      - name: Guard fixed feature and main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$FEATURE_BRANCH" "$PREVIEW_BRANCH"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_FEATURE_HEAD"
          test "$(git diff --name-only "$EXPECTED_FEATURE_HEAD"..HEAD)" = ".github/workflows/v065-preview-refresh.yml"
          node <<'NODE'
          const game = JSON.parse(require('fs').readFileSync('game.json','utf8'));
          if (game.firstLayout !== 'FROST LAB') throw new Error(`firstLayout=${JSON.stringify(game.firstLayout)}`);
          if (!game.layouts.some(x => x.name === 'FROST LAB')) throw new Error('FROST LAB missing');
          console.log('FROST LAB startup guard PASS');
          NODE

      - name: Install GDevelop runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libnss3 libasound2t64 xvfb unzip curl

      - name: Download exact GDevelop 5.6.282
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/gdevelop.zip "https://github.com/4ian/GDevelop/releases/download/v5.6.282/GDevelop-5-5.6.282-linux.zip"
          echo "$GDEVELOP_SHA256  /tmp/gdevelop.zip" | sha256sum -c -
          mkdir -p /tmp/gdevelop
          unzip -q /tmp/gdevelop.zip -d /tmp/gdevelop
          GDEVELOP_BIN="$(find /tmp/gdevelop -type f -name gdevelop -perm -111 | head -n 1)"
          test -n "$GDEVELOP_BIN"
          echo "GDEVELOP_BIN=$GDEVELOP_BIN" >> "$GITHUB_ENV"

      - name: Run v0.6.5 startup regression
        shell: bash
        run: |
          set -euo pipefail
          rm -f gameplay-test-results.json
          xvfb-run -a "$GDEVELOP_BIN" --no-sandbox --disable-update-check --run-command RUN_ALL_TESTS "$GITHUB_WORKSPACE/game.json" --cmd-args 'v0.6.5 Production Round Start test'
          test -f gameplay-test-results.json
          cat gameplay-test-results.json

      - name: Export fixed HTML5 preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build /tmp/v065-fixed-build
          xvfb-run -a "$GDEVELOP_BIN" --no-sandbox --disable-update-check --run-command EXPORT_HTML5_EXTERNAL "$GITHUB_WORKSPACE/game.json"
          test -f build/index.html
          test -f build/code0.js
          cp -a build /tmp/v065-fixed-build

      - name: Refresh preview branch through detached worktree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -rf /tmp/preview-worktree
          git worktree add --detach /tmp/preview-worktree "origin/$PREVIEW_BRANCH"
          cd /tmp/preview-worktree
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/v065-fixed-build/. .
          printf 'ICE WOLF v0.6.5 Production Round Start preview\nsource branch: %s\nsource commit: %s\nbaseline: %s\nstartup scene: FROST LAB\n' "$FEATURE_BRANCH" "$EXPECTED_FEATURE_HEAD" "$BASE_SHA" > PREVIEW_SOURCE.txt
          git add -A
          git commit -m 'preview: refresh v0.6.5 with FROST LAB startup [skip ci]'
          git push origin "HEAD:$PREVIEW_BRANCH"

      - name: Remove one-time preview helper
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git checkout "$FEATURE_BRANCH"
          git pull --ff-only origin "$FEATURE_BRANCH"
          git rm .github/workflows/v065-preview-refresh.yml
          git commit -m 'chore: remove v0.6.5 preview refresh helper [skip ci]'
          git push origin "HEAD:$FEATURE_BRANCH"
