name: Fix v0.6.0 Role Toggle Preserve State

on:
  push:
    branches:
      - feature/v060-human-side-cpu-wolf
    paths:
      - tools/fix_v060_role_toggle_preserve_state.py

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v060-human-side-cpu-wolf

      - name: Apply role-toggle preservation fix
        run: python tools/fix_v060_role_toggle_preserve_state.py

      - name: Parse project JSON
        run: python -m json.tool game.json > /dev/null

      - name: Validate v0.6.0 role semantics and protected invariants
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('game.json').read_text(encoding='utf-8'))
          frost = next(x for x in data['layouts'] if x.get('name') == 'FROST LAB')
          actors = [x for x in frost['instances'] if x.get('name') == 'Actor']
          assert len(actors) == 6

          vars_by_name = {v['name']: v for v in frost['variables']}
          assert vars_by_name['MatchDuration']['value'] == 210
          assert vars_by_name['MatchTimeLeft']['value'] == 210
          assert vars_by_name['WolfCooldown']['value'] == 5
          assert vars_by_name['WolfModeDuration']['value'] == 5

          objects = {o['name']: o for o in frost['objects']}
          assert objects['BuildText']['string'] == '開発版 v0.6.0'
          assert objects['BuildText']['content']['text'] == '開発版 v0.6.0'

          def clicked(e, name):
              for c in e.get('conditions', []):
                  if c.get('type', {}).get('value') == 'ButtonStates::ButtonFSM::IsClicked':
                      p = c.get('parameters', [])
                      if p and p[0] == name:
                          return True
              return False

          wolf_actions = next(e for e in frost['events'] if e.get('name') == 'Wolf actions')
          toggle = next(e for e in wolf_actions['events'] if clicked(e, 'TestRoleButton'))
          js = next(e for e in toggle.get('events', []) if e.get('type') == 'BuiltinCommonInstructions::JsCode' and any('__iceWolfPrimaryCPUWolf' in line for line in e.get('inlineCode', [])))
          role_source = '\n'.join(js['inlineCode'])

          assert "const candidates = actors.filter" in role_source
          assert "const existingWolf = actors.find" in role_source
          assert "if (actor.__iceWolfPrimaryCPUWolf)" in role_source
          assert "av.get('State').setString('Active')" not in role_source
          assert "wv.get('State').setString('Active')" not in role_source
          assert "av.get('Role').setString('Human')" in role_source

          step2 = next(t for t in data['tests'] if t.get('name') == 'STEP2 core test')
          step2_source = '\n'.join(step2['source'])
          assert "actors().length === 6" in step2_source
          assert "ttxt.text === '3:30' || ttxt.text === '3:29'" in step2_source
          assert "const last = actors()[5]" in step2_source

          targeted = next(t for t in data['tests'] if t.get('name') == 'v0.6.0 human-side CPU Wolf test')
          assert targeted['lastRunStatus'] == 'not-run'

          serialized = Path('game.json').read_text(encoding='utf-8')
          for token in ['FrozenWolfCandidate','0x0077ff','0x8b0000','感染させた（正体は秘密）','freeze_crack.wav']:
              assert token in serialized, token

          print('v0.6.0 role-toggle preservation validation PASS')
          PY

      - name: Commit fixed game.json only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No game.json change produced; stopping.'
            exit 1
          fi
          git commit -m 'fix: preserve actor states during human-side role toggle'
          git push origin HEAD:feature/v060-human-side-cpu-wolf
