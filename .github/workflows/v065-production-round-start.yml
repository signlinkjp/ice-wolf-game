name: v0.6.5 Production Round Start

on:
  push:
    branches:
      - feature/v065-production-round-start
    paths:
      - .github/workflows/v065-production-round-start.yml

permissions:
  contents: write

jobs:
  implement-validate-cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'remove v0.6.5 implementation helpers') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_SHA: 9c24143327abfb2bdd9a6a9b0d13cd2f1422eea1
      FEATURE_BRANCH: feature/v065-production-round-start
      PREVIEW_BRANCH: preview-v065-production-round-start
      GDEVELOP_VERSION: 5.6.282
      GDEVELOP_SHA256: c1d23616562befbde242412913785dacb0bb15a79e8c101c1553dc729b1e0472
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v065-production-round-start
          fetch-depth: 0

      - name: Guard canonical baseline and untouched game
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$FEATURE_BRANCH"
          actual_main="$(git rev-parse origin/main)"
          echo "origin/main=$actual_main"
          test "$actual_main" = "$BASE_SHA"
          git diff --exit-code "$BASE_SHA" -- game.json
          test -f scripts/v065-runtime-source.js
          test -f scripts/apply-v065-production-round-start.mjs
          node --check scripts/v065-runtime-source.js
          node --check scripts/apply-v065-production-round-start.mjs
          cp game.json /tmp/base-v064.json

      - name: Apply v0.6.5 production round patch
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-v065-production-round-start.mjs
          node -e "JSON.parse(require('fs').readFileSync('game.json','utf8')); console.log('JSON parse PASS')"

      - name: Verify protected gameplay groups are byte-equivalent as decoded JSON
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const before = JSON.parse(fs.readFileSync('/tmp/base-v064.json','utf8'));
          const after = JSON.parse(fs.readFileSync('game.json','utf8'));
          const b = before.layouts.find(x => x.name === 'FROST LAB');
          const a = after.layouts.find(x => x.name === 'FROST LAB');
          if (!a || !b) throw new Error('FROST LAB missing');
          const names = [
            'v0.6.4 Device-Tuned Mobile Virtual Joystick UI',
            'v0.6.3 Virtual joystick + keyboard movement (fixed camera)',
            'v0.6.4 Overview Camera Toggle UI',
            'v0.6.4 Normal + Overview camera',
            'Playable bounds + failsafe',
            'Wolf match flow',
            'Wolf actions',
            'v0.3 Action clarity feedback',
            'v0.3.5 actor size parity + frozen color enforcement',
            'v0.3.4 guaranteed solid-state visuals',
            'v0.6.1 Human CPU Navigation Recovery + CPU Wolf Cycle',
            'v0.6.0 CPU Wolf device diagnostic status',
            'v0.6.2 Color-independent Actor ID Labels'
          ];
          for (const name of names) {
            const be = b.events.find(e => e.name === name);
            const ae = a.events.find(e => e.name === name);
            if (!be || !ae) throw new Error(`protected group missing: ${name}`);
            if (JSON.stringify(be) !== JSON.stringify(ae)) throw new Error(`protected group changed: ${name}`);
          }
          const getVar = (scene, name) => scene.variables.find(v => v.name === name)?.value;
          if (getVar(a,'MatchDuration') !== 210) throw new Error('MatchDuration drift');
          if (getVar(a,'WolfCooldown') !== 5 || getVar(a,'WolfModeDuration') !== 5) throw new Error('Wolf timing drift');
          if (a.instances.filter(i => i.name === 'Actor').length !== 6) throw new Error('Actor count drift');
          console.log('Protected gameplay groups PASS');
          NODE

      - name: Install GDevelop runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libnss3 libasound2t64 xvfb unzip curl

      - name: Download exact GDevelop 5.6.282
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/gdevelop.zip "https://github.com/4ian/GDevelop/releases/download/v5.6.282/GDevelop-5-5.6.282-linux.zip"
          echo "$GDEVELOP_SHA256  /tmp/gdevelop.zip" | sha256sum -c -
          mkdir -p /tmp/gdevelop
          unzip -q /tmp/gdevelop.zip -d /tmp/gdevelop
          GDEVELOP_BIN="$(find /tmp/gdevelop -type f -name gdevelop -perm -111 | head -n 1)"
          test -n "$GDEVELOP_BIN"
          echo "GDEVELOP_BIN=$GDEVELOP_BIN" >> "$GITHUB_ENV"
          "$GDEVELOP_BIN" --version || true

      - name: Run v0.6.5 production-round gameplay test
        shell: bash
        run: |
          set -euo pipefail
          rm -f gameplay-test-results.json
          xvfb-run -a "$GDEVELOP_BIN" --no-sandbox --disable-update-check --run-command RUN_ALL_TESTS "$GITHUB_WORKSPACE/game.json" --cmd-args 'v0.6.5 Production Round Start test'
          test -f gameplay-test-results.json
          cat gameplay-test-results.json

      - name: Run protected regression suite
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            'v0.6.4 Device Tuning liveness test'
            'v0.6.4 Compact Joystick + Overview Camera test'
            'v0.6.3 Mobile Virtual Joystick test'
            'Stability self-test'
            'v0.6.2 Color-independent Actor ID Labels test'
            'v0.6.1 Human CPU navigation recovery test'
            'v0.6.0 human-side CPU Wolf test'
            'v0.6.0 CPU Wolf device diagnostic test'
          )
          for test_name in "${tests[@]}"; do
            echo "=== $test_name ==="
            rm -f gameplay-test-results.json
            xvfb-run -a "$GDEVELOP_BIN" --no-sandbox --disable-update-check --run-command RUN_ALL_TESTS "$GITHUB_WORKSPACE/game.json" --cmd-args "$test_name"
            test -f gameplay-test-results.json
            cat gameplay-test-results.json
          done

      - name: Confirm strict diagnostic debt unchanged at 14
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build /tmp/base-strict /tmp/feature-strict
          mkdir -p /tmp/base-strict /tmp/feature-strict
          set +e
          (cd /tmp/feature-strict && xvfb-run -a "$GDEVELOP_BIN" --no-sandbox --disable-update-check --block-on-diagnostic-errors --run-command EXPORT_HTML5_EXTERNAL "$GITHUB_WORKSPACE/game.json") > /tmp/feature-strict.log 2>&1
          feature_rc=$?
          (cd /tmp/base-strict && xvfb-run -a "$GDEVELOP_BIN" --no-sandbox --disable-update-check --block-on-diagnostic-errors --run-command EXPORT_HTML5_EXTERNAL /tmp/base-v064.json) > /tmp/base-strict.log 2>&1
          base_rc=$?
          set -e
          cat /tmp/feature-strict.log
          cat /tmp/base-strict.log
          test "$feature_rc" -ne 0
          test "$base_rc" -ne 0
          grep -F '[CLI] Diagnostic report has 14 error(s). Export blocked.' /tmp/feature-strict.log
          grep -F '[CLI] Diagnostic report has 14 error(s). Export blocked.' /tmp/base-strict.log

      - name: Standard HTML5 export
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          xvfb-run -a "$GDEVELOP_BIN" --no-sandbox --disable-update-check --run-command EXPORT_HTML5_EXTERNAL "$GITHUB_WORKSPACE/game.json"
          test -f build/index.html
          test -f build/code0.js
          cp -a build /tmp/v065-build

      - name: Commit validated game.json only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add game.json
          cached="$(git diff --cached --name-only)"
          echo "$cached"
          test "$cached" = "game.json"
          git commit -m 'feat: add v0.6.5 Production Round Start [skip ci]'
          git push origin "HEAD:$FEATURE_BRANCH"

      - name: Remove one-time implementation helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/v065-runtime-source.js scripts/apply-v065-production-round-start.mjs .github/workflows/v065-production-round-start.yml
          git commit -m 'chore: remove v0.6.5 implementation helpers [skip ci]'
          git push origin "HEAD:$FEATURE_BRANCH"
          final_head="$(git rev-parse HEAD)"
          echo "FINAL_FEATURE_HEAD=$final_head" >> "$GITHUB_ENV"
          final_files="$(git diff --name-only "$BASE_SHA"..HEAD)"
          echo "Final tree delta vs baseline:"
          echo "$final_files"
          test "$final_files" = "game.json"
          git diff --exit-code HEAD -- game.json

      - name: Publish immutable-source iPhone preview branch
        shell: bash
        run: |
          set -euo pipefail
          test -d /tmp/v065-build
          git checkout --orphan "$PREVIEW_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/v065-build/. .
          printf 'ICE WOLF v0.6.5 Production Round Start preview\nsource branch: %s\nsource commit: %s\nbaseline: %s\n' "$FEATURE_BRANCH" "$FINAL_FEATURE_HEAD" "$BASE_SHA" > PREVIEW_SOURCE.txt
          git add -A
          git commit -m 'preview: v0.6.5 Production Round Start [skip ci]'
          git push origin "HEAD:$PREVIEW_BRANCH"
          echo "Preview source commit: $FINAL_FEATURE_HEAD"
