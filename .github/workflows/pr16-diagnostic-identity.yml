name: PR16 Diagnostic Runtime Expression Audit

on:
  push:
    branches:
      - diag/pr16-identity-audit
    paths:
      - .github/workflows/pr16-diagnostic-identity.yml

permissions:
  contents: read

jobs:
  locate-runtime-expression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: 9c24143327abfb2bdd9a6a9b0d13cd2f1422eea1
      PR_HEAD: b5b56a691cb5948bcf3c4ccfbcd431d746509073
      FEATURE_BRANCH: feature/v065-production-round-start
      GDEVELOP_SHA256: c1d23616562befbde242412913785dacb0bb15a79e8c101c1553dc729b1e0472
      WORKFLOW_PATH: .github/workflows/pr16-diagnostic-identity.yml
      RUNTIME_BUNDLE: www/static/js/local-app.4119ac3d.chunk.js
      MARKER: Diagnostic report has
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initial no-drift guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$FEATURE_BRANCH"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse origin/$FEATURE_BRANCH)" = "$PR_HEAD"
          test "$(git diff --name-only "$PR_HEAD"..HEAD)" = "$WORKFLOW_PATH"
          echo 'initial guard PASS'

      - name: Inspect runtime JS marker and diagnostic expression only
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/gdevelop.zip "https://github.com/4ian/GDevelop/releases/download/v5.6.282/GDevelop-5-5.6.282-linux.zip" >/dev/null
          echo "$GDEVELOP_SHA256  /tmp/gdevelop.zip" | sha256sum -c -
          rm -rf /tmp/gdevelop /tmp/gdevelop-app /tmp/report
          mkdir -p /tmp/gdevelop /tmp/report
          unzip -q /tmp/gdevelop.zip -d /tmp/gdevelop
          ASAR="$(find /tmp/gdevelop -type f -name app.asar | head -n 1)"
          test -n "$ASAR"
          npx --yes asar@3.2.0 extract "$ASAR" /tmp/gdevelop-app >/dev/null
          test -f "/tmp/gdevelop-app/$RUNTIME_BUNDLE"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const bundle = process.env.RUNTIME_BUNDLE;
          const marker = process.env.MARKER;
          const full = path.join('/tmp/gdevelop-app', bundle);
          const text = fs.readFileSync(full, 'utf8');
          const positions = [];
          for (let from = 0;;) {
            const i = text.indexOf(marker, from);
            if (i < 0) break;
            positions.push(i);
            from = i + marker.length;
          }
          const hitCount = positions.length;
          let expression = 'UNRESOLVED';
          let unique = false;
          let reason = '';
          let snippet = '(snippet unavailable)\n';
          if (hitCount !== 1) {
            reason = `runtime marker hit count=${hitCount}`;
          } else {
            const pos = positions[0];
            const start = Math.max(0, pos - 700);
            const end = Math.min(text.length, pos + marker.length + 700);
            snippet = text.slice(start, end);
            const local = text.slice(Math.max(0, pos - 120), Math.min(text.length, pos + marker.length + 300));
            const re = /([A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)*)\.length/g;
            const candidates = [];
            let m;
            while ((m = re.exec(local))) candidates.push(m[1]);
            const distinct = [...new Set(candidates)];
            if (distinct.length === 1) {
              expression = distinct[0];
              unique = true;
              reason = 'exactly one .length expression near the runtime marker';
            } else {
              reason = `near-marker .length expressions=${JSON.stringify(distinct)}`;
            }
          }
          fs.writeFileSync('/tmp/report/marker-snippet.txt', snippet);
          fs.writeFileSync('/tmp/report/analysis.txt', [
            'GDevelop=5.6.282',
            `GDevelopZipSHA256=${process.env.GDEVELOP_SHA256}`,
            `runtimeBundle=${bundle}`,
            `marker=${marker}`,
            `markerHitCount=${hitCount}`,
            `diagnosticArrayExpression=${expression}`,
            `unique=${unique ? 'YES' : 'NO'}`,
            `verdict=${unique ? 'GO' : 'STOP'}`,
            `reason=${reason}`,
            'scope=runtime JS inspection only; no instrumentation/repack/diagnostic execution',
            ''
          ].join('\n'));
          NODE
          (cd /tmp/report && sha256sum marker-snippet.txt analysis.txt > MANIFEST.sha256)
          cat /tmp/report/analysis.txt

      - name: Upload minimal runtime-expression artifact
        uses: actions/upload-artifact@v4
        with:
          name: icewolf-pr16-runtime-expression
          path: |
            /tmp/report/marker-snippet.txt
            /tmp/report/analysis.txt
            /tmp/report/MANIFEST.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Final no-drift guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$FEATURE_BRANCH"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse origin/$FEATURE_BRANCH)" = "$PR_HEAD"
          test "$(git diff --name-only "$PR_HEAD"..HEAD)" = "$WORKFLOW_PATH"
          echo 'final guard PASS'
