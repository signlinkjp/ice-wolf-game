name: PR16 Pre-Feedback Raw Diagnostic Smoke

on:
  push:
    branches:
      - diag/pr16-identity-audit
    paths:
      - .github/workflows/pr16-diagnostic-identity.yml

permissions:
  contents: read

jobs:
  pre-feedback-raw-diagnostic-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: 9c24143327abfb2bdd9a6a9b0d13cd2f1422eea1
      PRE_FEEDBACK_HEAD: ec003356f33161fe3b23252ae09f2649d2e291ee
      PR_HEAD: b5b56a691cb5948bcf3c4ccfbcd431d746509073
      FEATURE_BRANCH: feature/v065-production-round-start
      GDEVELOP_SHA256: c1d23616562befbde242412913785dacb0bb15a79e8c101c1553dc729b1e0472
      WORKFLOW_PATH: .github/workflows/pr16-diagnostic-identity.yml
      RUNTIME_BUNDLE: www/static/js/local-app.4119ac3d.chunk.js
      SENTINEL: __IW_DIAG_JSON__
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initial no-drift guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$FEATURE_BRANCH"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse origin/$FEATURE_BRANCH)" = "$PR_HEAD"
          test "$(git diff --name-only "$PR_HEAD"..HEAD)" = "$WORKFLOW_PATH"
          git cat-file -e "$PRE_FEEDBACK_HEAD^{commit}"
          echo 'initial guard PASS'

      - name: Prepare exact GDevelop and pre-feedback project
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y libnss3 libasound2t64 xvfb unzip curl >/dev/null
          curl -L --fail --retry 3 -o /tmp/gdevelop.zip "https://github.com/4ian/GDevelop/releases/download/v5.6.282/GDevelop-5-5.6.282-linux.zip" >/dev/null
          echo "$GDEVELOP_SHA256  /tmp/gdevelop.zip" | sha256sum -c -
          rm -rf /tmp/gdevelop /tmp/gdevelop-app /tmp/report /tmp/strict
          mkdir -p /tmp/gdevelop /tmp/report /tmp/strict
          unzip -q /tmp/gdevelop.zip -d /tmp/gdevelop
          GDEVELOP_BIN="$(find /tmp/gdevelop -type f -name gdevelop -perm -111 | head -n 1)"
          ASAR="$(find /tmp/gdevelop -type f -name app.asar | head -n 1)"
          test -n "$GDEVELOP_BIN" && test -n "$ASAR"
          echo "GDEVELOP_BIN=$GDEVELOP_BIN" >> "$GITHUB_ENV"
          echo "ASAR=$ASAR" >> "$GITHUB_ENV"
          git show "$PRE_FEEDBACK_HEAD:game.json" > /tmp/pre-feedback-game.json
          python3 -m json.tool /tmp/pre-feedback-game.json >/dev/null
          echo 'exact GDevelop + pre-feedback project PASS'

      - name: Instrument temporary runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          npx --yes asar@3.2.0 extract "$ASAR" /tmp/gdevelop-app >/dev/null
          test -f "/tmp/gdevelop-app/$RUNTIME_BUNDLE"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const p = path.join('/tmp/gdevelop-app', process.env.RUNTIME_BUNDLE);
          const text = fs.readFileSync(p, 'utf8');
          const anchor = 'const t=(0,No.d8)(e);if(t.length>0)throw console.error(';
          const count = text.split(anchor).length - 1;
          if (count !== 1) throw new Error(`instrumentation anchor count=${count}`);
          const replacement = 'const t=(0,No.d8)(e);console.error("' + process.env.SENTINEL + '"+JSON.stringify(t));if(t.length>0)throw console.error(';
          fs.writeFileSync(p, text.replace(anchor, replacement));
          console.log('temporary instrumentation anchor PASS');
          NODE
          npx --yes asar@3.2.0 pack /tmp/gdevelop-app /tmp/app.instrumented.asar >/dev/null
          cp /tmp/app.instrumented.asar "$ASAR"
          echo 'temporary app.asar repack PASS'

      - name: Run one pre-feedback strict diagnostic and extract JSON
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (cd /tmp/strict && xvfb-run -a "$GDEVELOP_BIN" --no-sandbox --disable-update-check --block-on-diagnostic-errors --run-command EXPORT_HTML5_EXTERNAL /tmp/pre-feedback-game.json) > /tmp/pre-feedback-strict.log 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          python3 <<'PY'
          import json
          from pathlib import Path
          sentinel='__IW_DIAG_JSON__'
          hits=[]
          for line in Path('/tmp/pre-feedback-strict.log').read_text(encoding='utf-8',errors='replace').splitlines():
              if sentinel in line:
                  payload=line.split(sentinel,1)[1].strip()
                  try: hits.append(json.loads(payload))
                  except Exception: pass
          if len(hits)!=1: raise SystemExit(f'valid sentinel JSON hit count={len(hits)}')
          data=hits[0]
          if not isinstance(data,list): raise SystemExit('diagnostic payload is not an array')
          first=data[0] if data else None
          expected={'type','isCondition','instructionType','instructionSentence','locationName','locationType','eventPath'}
          schema_ok=(first is None) or (isinstance(first,dict) and expected.issubset(first.keys()))
          if not schema_ok: raise SystemExit('first diagnostic schema check failed')
          Path('/tmp/report/pre-feedback-diagnostics.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          summary='\n'.join([
              'GDevelop=5.6.282',
              'source=pre-feedback',
              'sourceSHA=ec003356f33161fe3b23252ae09f2649d2e291ee',
              f'diagnosticCount={len(data)}',
              'jsonParse=PASS',
              'firstSchema=PASS',
              'verdict=GO',
              ''
          ])
          Path('/tmp/report/pre-feedback-summary.txt').write_text(summary,encoding='utf-8')
          print(summary)
          PY
          (cd /tmp/report && sha256sum pre-feedback-diagnostics.json pre-feedback-summary.txt > MANIFEST.sha256)

      - name: Upload minimal pre-feedback diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: icewolf-pr16-pre-feedback-diagnostics
          path: |
            /tmp/report/pre-feedback-diagnostics.json
            /tmp/report/pre-feedback-summary.txt
            /tmp/report/MANIFEST.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Final no-drift guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$FEATURE_BRANCH"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse origin/$FEATURE_BRANCH)" = "$PR_HEAD"
          test "$(git diff --name-only "$PR_HEAD"..HEAD)" = "$WORKFLOW_PATH"
          echo 'final guard PASS'
