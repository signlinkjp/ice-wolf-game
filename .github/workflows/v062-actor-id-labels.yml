name: v0.6.2 Color-independent Actor ID Labels One-Time Gate

on:
  push:
    branches:
      - feature/v062-actor-id-labels
    paths:
      - '.github/workflows/v062-actor-id-labels.yml'

permissions:
  contents: write

jobs:
  implement-test-build-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact v0.6.2 feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v062-actor-id-labels
          fetch-depth: 0

      - name: Guard exact v0.6.1 real-device-PASS baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE='7697cbd998046bfc6c0e7e027342b164fd1ebd05'
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --quiet "$BASE" -- game.json
          ACTUAL="$(git diff --name-only "$BASE"..HEAD | sort)"
          EXPECTED='.github/workflows/v062-actor-id-labels.yml'
          test "$ACTUAL" = "$EXPECTED"
          git show "$BASE":game.json > main-baseline.json
          python3 -m json.tool main-baseline.json >/dev/null
          test -z "$(git diff --name-only "$BASE" -- game.json)"
          echo 'Exact v0.6.1 baseline guard PASS.'

      - name: Implement fixed YOU and A-F diagnostic labels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json

          path = 'game.json'
          with open(path, encoding='utf-8') as f:
              data = json.load(f)

          frost = next(x for x in data['layouts'] if x.get('name') == 'FROST LAB')
          build = next(x for x in frost['objects'] if x.get('name') == 'BuildText')
          player_obj = next(x for x in frost['objects'] if x.get('name') == 'Player')
          actor_obj = next(x for x in frost['objects'] if x.get('name') == 'Actor')

          assert build['string'] == '開発版 v0.6.1-DIAG', build['string']
          build['string'] = '開発版 v0.6.2-DIAG'
          build['content']['text'] = '開発版 v0.6.2-DIAG'

          def append_variable(obj, name, value):
              variables = obj.setdefault('variables', [])
              assert not any(v.get('name') == name for v in variables), (obj.get('name'), name)
              variables.append({'name': name, 'type': 'string', 'value': value})

          append_variable(player_obj, 'DisplayId', 'YOU')
          append_variable(actor_obj, 'DisplayId', '')

          actor_instances = [x for x in frost['instances'] if x.get('name') == 'Actor']
          assert len(actor_instances) == 6, len(actor_instances)
          for instance, label in zip(actor_instances, 'ABCDEF'):
              initial = instance.setdefault('initialVariables', [])
              assert not any(v.get('name') == 'DisplayId' for v in initial), label
              initial.append({'name': 'DisplayId', 'type': 'string', 'value': label})

          assert not any(v.get('name') == 'ActorIdLabelsReady' for v in frost.get('variables', []))
          frost['variables'].append({'name': 'ActorIdLabelsReady', 'type': 'boolean', 'value': False})

          label_code = r'''const vars = runtimeScene.getVariables();
          const players = runtimeScene.getObjects('Player');
          const actors = runtimeScene.getObjects('Actor');
          const player = players.length ? players[0] : null;
          const targets = player ? [player, ...actors] : [];
          const expectedIds = ['YOU', 'A', 'B', 'C', 'D', 'E', 'F'];
          const idsAreValid = targets.length === expectedIds.length && targets.every((obj, index) => obj.getVariables().get('DisplayId').getAsString() === expectedIds[index]);
          if (!idsAreValid) {
            vars.get('ActorIdLabelsReady').setBoolean(false);
          } else if (typeof document !== 'undefined' && typeof THREE !== 'undefined') {
            const canvas = document.querySelector('canvas');
            const baseLayer = player.getInstanceContainer().getLayer(player.getLayer());
            const layerRenderer = baseLayer && baseLayer.getRenderer ? baseLayer.getRenderer() : null;
            const camera = layerRenderer && layerRenderer.getThreeCamera ? layerRenderer.getThreeCamera() : null;
            if (canvas && camera) {
              if (!runtimeScene.__iceWolfV062IdLabels) {
                for (const old of document.querySelectorAll('[data-ice-wolf-v062-id-label="1"]')) old.remove();
                runtimeScene.__iceWolfV062IdLabels = new Map();
                for (const obj of targets) {
                  const id = obj.getVariables().get('DisplayId').getAsString();
                  const el = document.createElement('div');
                  el.dataset.iceWolfV062IdLabel = '1';
                  el.textContent = id;
                  el.style.position = 'fixed';
                  el.style.left = '0';
                  el.style.top = '0';
                  el.style.transform = 'translate(-50%, -100%)';
                  el.style.zIndex = '2147483000';
                  el.style.pointerEvents = 'none';
                  el.style.userSelect = 'none';
                  el.style.webkitUserSelect = 'none';
                  el.style.minWidth = id === 'YOU' ? '38px' : '24px';
                  el.style.padding = '2px 6px';
                  el.style.borderRadius = '8px';
                  el.style.border = '2px solid rgba(255,255,255,0.96)';
                  el.style.background = 'rgba(0,0,0,0.78)';
                  el.style.color = '#ffffff';
                  el.style.fontFamily = '-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
                  el.style.fontSize = '18px';
                  el.style.fontWeight = '800';
                  el.style.lineHeight = '22px';
                  el.style.textAlign = 'center';
                  el.style.textShadow = '0 1px 2px #000,1px 0 1px #000,-1px 0 1px #000,0 -1px 1px #000';
                  document.body.appendChild(el);
                  runtimeScene.__iceWolfV062IdLabels.set(obj, el);
                }
              }
              const rect = canvas.getBoundingClientRect();
              camera.updateMatrixWorld(true);
              for (const obj of targets) {
                const el = runtimeScene.__iceWolfV062IdLabels.get(obj);
                const mesh = obj.get3DRendererObject && obj.get3DRendererObject();
                if (!el || !mesh) {
                  if (el) el.style.display = 'none';
                  continue;
                }
                mesh.updateMatrixWorld(true);
                const projected = new THREE.Vector3();
                mesh.getWorldPosition(projected);
                projected.project(camera);
                const visible = projected.z >= -1 && projected.z <= 1 && projected.x >= -1.08 && projected.x <= 1.08 && projected.y >= -1.08 && projected.y <= 1.08;
                if (!visible) {
                  el.style.display = 'none';
                  continue;
                }
                const screenX = rect.left + (projected.x * 0.5 + 0.5) * rect.width;
                const screenY = rect.top + (-projected.y * 0.5 + 0.5) * rect.height - 16;
                el.style.display = 'block';
                el.style.left = `${screenX}px`;
                el.style.top = `${screenY}px`;
                el.textContent = obj.getVariables().get('DisplayId').getAsString();
              }
              vars.get('ActorIdLabelsReady').setBoolean(runtimeScene.__iceWolfV062IdLabels.size === 7);
            }
          }'''
          label_lines = [line.strip() if line.startswith('          ') else line for line in label_code.splitlines()]

          frost['events'].append({
              'colorB': 228,
              'colorG': 176,
              'colorR': 74,
              'creationTime': 0,
              'name': 'v0.6.2 Color-independent Actor ID Labels',
              'source': '',
              'type': 'BuiltinCommonInstructions::Group',
              'events': [{
                  'type': 'BuiltinCommonInstructions::JsCode',
                  'inlineCode': label_lines,
                  'parameterObjects': '',
                  'useStrict': True,
                  'eventsSheetExpanded': False,
                  'actions': []
              }],
              'parameters': [],
              'actions': []
          })

          test_source = [
              "await harness.goToScene('FROST LAB');",
              "await harness.stepFrames(30);",
              "const player = harness.getObjects('Player')[0];",
              "const actors = harness.getObjects('Actor');",
              "const getVar = (id, name) => harness.getObjectVariable(id, name)?.value;",
              "harness.assert(!!player, 'Player exists');",
              "harness.assert(actors.length === 6, `six Actors, got ${actors.length}`);",
              "harness.assert(getVar(player.id, 'DisplayId') === 'YOU', `Player label is YOU: ${getVar(player.id, 'DisplayId')}`);",
              "const ids = actors.map(a => getVar(a.id, 'DisplayId'));",
              "harness.assert([...ids].sort().join(',') === 'A,B,C,D,E,F', `Actor labels are fixed A-F: ${ids.join(',')}`);",
              "harness.assert(harness.getSceneVariable('ActorIdLabelsReady')?.value === true, 'label overlay initialized');",
              "harness.setSceneVariable('GameOver', true);",
              "const actorA = actors.find(a => getVar(a.id, 'DisplayId') === 'A');",
              "harness.assert(!!actorA, 'Actor A exists');",
              "harness.setObjectVariable(actorA.id, 'Role', 'Wolf');",
              "harness.setObjectVariable(actorA.id, 'AIWolfModeLeft', 5);",
              "await harness.stepFrames(5);",
              "harness.assert(getVar(actorA.id, 'DisplayId') === 'A', 'A stays A after Human/Wolf role change');",
              "harness.setObjectVariable(actorA.id, 'State', 'Frozen');",
              "await harness.stepFrames(5);",
              "harness.assert(getVar(actorA.id, 'DisplayId') === 'A', 'A stays A while frozen/red');",
              "harness.setObjectVariable(player.id, 'Role', 'Human');",
              "await harness.stepFrames(3);",
              "harness.assert(getVar(player.id, 'DisplayId') === 'YOU', 'YOU stays YOU after Player role change');",
              "harness.assert(harness.getObjects('BuildText')[0].text === '開発版 v0.6.2-DIAG', `BuildText is v0.6.2: ${harness.getObjects('BuildText')[0].text}`);",
              ""
          ]
          assert not any(t.get('name') == 'v0.6.2 Color-independent Actor ID Labels test' for t in data.get('tests', []))
          data.setdefault('tests', []).append({
              'description': 'Fixed YOU/A-F labels remain readable identities independent of Human/Wolf role and frozen color state',
              'lastRunAt': 0,
              'lastRunDurationMs': 0,
              'lastRunFramesExecuted': 0,
              'lastRunStatus': 'not-run',
              'name': 'v0.6.2 Color-independent Actor ID Labels test',
              'type': 'gameplay',
              'source': test_source
          })

          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, separators=(',', ':'))
          print('v0.6.2 fixed actor identity labels implemented.')
          PY
          python3 -m json.tool game.json >/dev/null

      - name: Verify v0.6.2 structure and protected gameplay logic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json

          with open('main-baseline.json', encoding='utf-8') as f:
              before = json.load(f)
          with open('game.json', encoding='utf-8') as f:
              after = json.load(f)

          b_frost = next(x for x in before['layouts'] if x.get('name') == 'FROST LAB')
          a_frost = next(x for x in after['layouts'] if x.get('name') == 'FROST LAB')

          def event(scene, name):
              items = [x for x in scene['events'] if x.get('name') == name]
              assert len(items) == 1, (name, len(items))
              return items[0]

          for protected in (
              'v0.6.1 Human CPU Navigation Recovery + CPU Wolf Cycle',
              'v0.3.4 guaranteed solid-state visuals',
          ):
              assert event(b_frost, protected) == event(a_frost, protected), protected

          protected_tests = (
              'v0.6.1 Human CPU navigation recovery test',
              'v0.6.0 human-side CPU Wolf test',
              'v0.6.0 CPU Wolf device diagnostic test',
          )
          b_tests = {x['name']: x for x in before['tests']}
          a_tests = {x['name']: x for x in after['tests']}
          for name in protected_tests:
              assert b_tests[name] == a_tests[name], name

          build = next(x for x in a_frost['objects'] if x.get('name') == 'BuildText')
          assert build['string'] == '開発版 v0.6.2-DIAG'
          assert build['content']['text'] == '開発版 v0.6.2-DIAG'

          player = next(x for x in a_frost['objects'] if x.get('name') == 'Player')
          actor = next(x for x in a_frost['objects'] if x.get('name') == 'Actor')
          pids = [v for v in player['variables'] if v.get('name') == 'DisplayId']
          aids = [v for v in actor['variables'] if v.get('name') == 'DisplayId']
          assert len(pids) == 1 and pids[0]['value'] == 'YOU', pids
          assert len(aids) == 1 and aids[0]['value'] == '', aids

          actor_instances = [x for x in a_frost['instances'] if x.get('name') == 'Actor']
          assert len(actor_instances) == 6
          fixed = []
          for inst in actor_instances:
              values = [v['value'] for v in inst.get('initialVariables', []) if v.get('name') == 'DisplayId']
              assert len(values) == 1, values
              fixed.append(values[0])
          assert fixed == list('ABCDEF'), fixed

          label_group = event(a_frost, 'v0.6.2 Color-independent Actor ID Labels')
          js = '\n'.join(label_group['events'][0]['inlineCode'])
          for marker in ('DisplayId', 'YOU', 'A', 'B', 'C', 'D', 'E', 'F', 'getWorldPosition', 'project(camera)', 'rgba(0,0,0,0.78)'):
              assert marker in js, marker
          assert "get('Role')" not in js
          assert 'AIWolfModeLeft' not in js
          assert 'AIWolfCooldownLeft' not in js
          assert 'Frozen' not in js
          assert 'Wolf' not in js

          names = [x.get('name') for x in after['tests']]
          assert names.count('v0.6.2 Color-independent Actor ID Labels test') == 1
          assert any(v.get('name') == 'ActorIdLabelsReady' and v.get('type') == 'boolean' for v in a_frost['variables'])
          print('v0.6.2 structural and protected-logic gate PASS.')
          PY

      - name: Install GDevelop Linux runtime dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libasound2t64 xvfb unzip curl

      - name: Download exact GDevelop 5.6.282 portable build
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/4ian/GDevelop/releases/download/v5.6.282/GDevelop-5-5.6.282-linux.zip' \
            --output /tmp/gdevelop.zip
          echo 'c1d23616562befbde242412913785dacb0bb15a79e8c101c1553dc729b1e0472  /tmp/gdevelop.zip' | sha256sum -c -
          mkdir -p /tmp/gdevelop
          unzip -q /tmp/gdevelop.zip -d /tmp/gdevelop
          BIN="$(find /tmp/gdevelop -type f -name gdevelop -perm -u+x | head -n 1)"
          if [ -z "$BIN" ]; then
            BIN="$(find /tmp/gdevelop -type f -name gdevelop | head -n 1)"
          fi
          test -n "$BIN"
          chmod +x "$BIN"
          echo "GDEVELOP_BIN=$BIN" >> "$GITHUB_ENV"
          echo "GDevelop binary: $BIN"

      - name: Run v0.6.2 Actor ID label gameplay test
        shell: bash
        run: |
          set -euo pipefail
          rm -f gameplay-test-results.json
          xvfb-run -a "$GDEVELOP_BIN" \
            --no-sandbox \
            --disable-update-check \
            --run-command RUN_ALL_TESTS "$GITHUB_WORKSPACE/game.json" \
            --cmd-args 'v0.6.2 Color-independent Actor ID Labels test'
          test -s gameplay-test-results.json
          mv gameplay-test-results.json v062-label-results.json

      - name: Run v0.6.1 Human navigation regression
        shell: bash
        run: |
          set -euo pipefail
          rm -f gameplay-test-results.json
          xvfb-run -a "$GDEVELOP_BIN" \
            --no-sandbox \
            --disable-update-check \
            --run-command RUN_ALL_TESTS "$GITHUB_WORKSPACE/game.json" \
            --cmd-args 'v0.6.1 Human CPU navigation recovery test'
          test -s gameplay-test-results.json
          mv gameplay-test-results.json v061-navigation-results.json

      - name: Run v0.6.0 Human-side CPU Wolf regression
        shell: bash
        run: |
          set -euo pipefail
          rm -f gameplay-test-results.json
          xvfb-run -a "$GDEVELOP_BIN" \
            --no-sandbox \
            --disable-update-check \
            --run-command RUN_ALL_TESTS "$GITHUB_WORKSPACE/game.json" \
            --cmd-args 'v0.6.0 human-side CPU Wolf test'
          test -s gameplay-test-results.json
          mv gameplay-test-results.json human-side-results.json

      - name: Run v0.6.0 CPU Wolf diagnostic regression
        shell: bash
        run: |
          set -euo pipefail
          rm -f gameplay-test-results.json
          xvfb-run -a "$GDEVELOP_BIN" \
            --no-sandbox \
            --disable-update-check \
            --run-command RUN_ALL_TESTS "$GITHUB_WORKSPACE/game.json" \
            --cmd-args 'v0.6.0 CPU Wolf device diagnostic test'
          test -s gameplay-test-results.json
          mv gameplay-test-results.json cpu-wolf-diag-results.json

      - name: Prove strict diagnostic debt did not increase
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          set +e
          xvfb-run -a "$GDEVELOP_BIN" \
            --no-sandbox \
            --disable-update-check \
            --block-on-diagnostic-errors \
            --run-command EXPORT_HTML5_EXTERNAL "$GITHUB_WORKSPACE/game.json" \
            > feature-strict.log 2>&1
          FEATURE_STATUS=$?
          set -e
          cat feature-strict.log
          test "$FEATURE_STATUS" -ne 0
          grep -Fq '[CLI] Diagnostic report has 14 error(s). Export blocked.' feature-strict.log

          rm -rf build
          set +e
          xvfb-run -a "$GDEVELOP_BIN" \
            --no-sandbox \
            --disable-update-check \
            --block-on-diagnostic-errors \
            --run-command EXPORT_HTML5_EXTERNAL "$GITHUB_WORKSPACE/main-baseline.json" \
            > baseline-strict.log 2>&1
          BASELINE_STATUS=$?
          set -e
          cat baseline-strict.log
          test "$BASELINE_STATUS" -ne 0
          grep -Fq '[CLI] Diagnostic report has 14 error(s). Export blocked.' baseline-strict.log
          echo 'Strict diagnostic provenance PASS: feature=14, baseline=14.'

      - name: Export v0.6.2 HTML5 and prepare iPhone preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          xvfb-run -a "$GDEVELOP_BIN" \
            --no-sandbox \
            --disable-update-check \
            --run-command EXPORT_HTML5_EXTERNAL "$GITHUB_WORKSPACE/game.json"
          test -s build/index.html
          test -s build/code0.js
          FILE_COUNT="$(find build -type f | wc -l)"
          test "$FILE_COUNT" -gt 5
          python3 - <<'PY'
          path = 'build/code0.js'
          with open(path, encoding='utf-8') as f:
              text = f.read()
          needle = 'Code.eventsList0 = function(runtimeScene) {\n\n};'
          matches = text.count(needle)
          assert matches == 1, matches
          text = text.replace(needle, 'Code.eventsList0 = function(runtimeScene) {\n  gdjs.evtTools.runtimeScene.replaceScene(runtimeScene, "FROST LAB", false);\n};', 1)
          with open(path, 'w', encoding='utf-8') as f:
              f.write(text)
          assert 'replaceScene(runtimeScene, "FROST LAB", false)' in text
          print('Preview-only blank-scene redirect injected.')
          PY
          printf '%s\n' \
            'ICE WOLF v0.6.2 Color-independent Actor ID Labels preview' \
            'source-main=7697cbd998046bfc6c0e7e027342b164fd1ebd05' \
            'feature=YOU + fixed A-F labels; role-independent; dark high-contrast tags' \
            > build/PREVIEW_SOURCE.txt
          touch build/.nojekyll
          rm -rf /tmp/v062-preview-build
          cp -a build /tmp/v062-preview-build
          echo "v0.6.2 standard export PASS: $FILE_COUNT files; preview staged."

      - name: Commit only final game.json and self-clean one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          BASE='7697cbd998046bfc6c0e7e027342b164fd1ebd05'
          rm -f main-baseline.json v062-label-results.json v061-navigation-results.json human-side-results.json cpu-wolf-diag-results.json feature-strict.log baseline-strict.log gameplay-test-results.json
          rm -rf build
          git rm .github/workflows/v062-actor-id-labels.yml
          git add game.json
          STAGED="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n' '.github/workflows/v062-actor-id-labels.yml' 'game.json' | sort)"
          test "$STAGED" = "$EXPECTED"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add v0.6.2 color-independent actor ID labels [skip ci]'
          git push origin HEAD:feature/v062-actor-id-labels
          FINAL="$(git diff --name-only "$BASE"..HEAD)"
          test "$FINAL" = 'game.json'
          test ! -e .github/workflows/v062-actor-id-labels.yml
          test -z "$(git status --porcelain)"
          echo "FINAL_FEATURE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo 'Final feature branch proof PASS: net delta vs v0.6.1 main is game.json only.'

      - name: Publish isolated v0.6.2 iPhone preview branch
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/v062-preview-build/index.html
          if git ls-remote --exit-code --heads origin preview-v062-actor-id-labels >/dev/null 2>&1; then
            echo 'STOP: preview-v062-actor-id-labels already exists unexpectedly.' >&2
            exit 1
          fi
          git switch --orphan preview-v062-actor-id-labels
          git rm -rf . || true
          cp -a /tmp/v062-preview-build/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'preview: v0.6.2 actor ID labels device test'
          git push origin HEAD:preview-v062-actor-id-labels
          echo "PREVIEW_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo 'Static v0.6.2 iPhone preview published.'

      - name: Final provenance report
        shell: bash
        run: |
          set -euo pipefail
          echo "feature head: $FINAL_FEATURE_HEAD"
          echo "preview head: $PREVIEW_HEAD"
          echo 'source main: 7697cbd998046bfc6c0e7e027342b164fd1ebd05'
          echo 'v0.6.2 gate COMPLETE'
