name: v0.6.5 STEP2 Multi-Freeze Diagnostic

on:
  push:
    branches:
      - feature/v065-production-round-start
    paths:
      - .github/workflows/v065-step2-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: 9c24143327abfb2bdd9a6a9b0d13cd2f1422eea1
      FEATURE_BRANCH: feature/v065-production-round-start
      GDEVELOP_SHA256: c1d23616562befbde242412913785dacb0bb15a79e8c101c1553dc729b1e0472
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v065-production-round-start
          fetch-depth: 0

      - name: Guard main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"

      - name: Apply candidate patch only in workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          p=Path('game.json'); d=json.loads(p.read_text(encoding='utf-8'))
          f=next(x for x in d['layouts'] if x.get('name')=='FROST LAB')
          def walk(es):
            for e in es or []:
              yield e
              yield from walk(e.get('events',[]))
          g=next(x for x in f['events'] if x.get('name')=='Wolf actions')
          target=[]
          for e in walk(g.get('events',[])):
            acts=e.get('actions',[])
            if any(a.get('type',{}).get('value')=='SetStringObjectVariable' and a.get('parameters',[None,None,None,None])[:4]==['Actor','State','=','\"Frozen\"'] for a in acts) and any(a.get('type',{}).get('value')=='PlaySound' and len(a.get('parameters',[]))>1 and a['parameters'][1]=='freeze_crack.wav' for a in acts): target.append(e)
          assert len(target)==1
          kept=[]
          for a in target[0]['actions']:
            t=a.get('type',{}).get('value'); q=a.get('parameters',[])
            if t=='SetNumberVariable' and q and q[0] in ('WolfModeLeft','CooldownLeft'): continue
            if t=='ChangeColor' and len(q)>=2 and q[0]=='Player' and q[1]=='\"255;255;255\"': continue
            kept.append(a)
          target[0]['actions']=kept
          core=next(t for t in d['tests'] if t.get('name')=='STEP2 core test')
          s=core['source']
          old="harness.assert(wm === 0, `E mode ends after one freeze`);"
          s[s.index(old)]="harness.assert(wm > 0, `E wolf mode remains active after first freeze (${wm})`);"
          old2="harness.assert(avar(t1.id,'State') === 'Active', `E no chain freeze`);"
          i=s.index(old2)
          s[i:i+1]=[
            "harness.assert(avar(t1.id,'State') === 'Active', `E second target remains Active without contact`);",
            "harness.setSceneVariable('WolfModeLeft', 0);",
            "harness.setSceneVariable('CooldownLeft', 0);",
            "await harness.stepFrames(3);",
          ]
          p.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY

      - name: Install and download GDevelop
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y libnss3 libasound2t64 xvfb unzip curl >/dev/null
          curl -L --fail --retry 3 -o /tmp/gdevelop.zip "https://github.com/4ian/GDevelop/releases/download/v5.6.282/GDevelop-5-5.6.282-linux.zip" >/dev/null
          echo "$GDEVELOP_SHA256  /tmp/gdevelop.zip" | sha256sum -c -
          mkdir -p /tmp/gdevelop
          unzip -q /tmp/gdevelop.zip -d /tmp/gdevelop
          echo "GDEVELOP_BIN=$(find /tmp/gdevelop -type f -name gdevelop -perm -111 | head -n 1)" >> "$GITHUB_ENV"

      - name: Run STEP2 and capture result
        shell: bash
        run: |
          set +e
          rm -f gameplay-test-results.json
          xvfb-run -a "$GDEVELOP_BIN" --no-sandbox --disable-update-check --run-command RUN_ALL_TESTS "$GITHUB_WORKSPACE/game.json" --cmd-args 'STEP2 core test'
          code=$?
          set -e
          test -f gameplay-test-results.json
          cp gameplay-test-results.json /tmp/step2-result.json
          echo "GDEVELOP_EXIT=$code" >> "$GITHUB_ENV"
          cat /tmp/step2-result.json

      - name: Persist diagnostic result only
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- game.json
          mkdir -p diagnostics
          cp /tmp/step2-result.json diagnostics/step2-multifreeze.json
          printf '%s\n' "$GDEVELOP_EXIT" > diagnostics/step2-multifreeze-exit.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/step2-multifreeze.json diagnostics/step2-multifreeze-exit.txt
          git commit -m 'chore: capture STEP2 multi-freeze diagnostic [skip ci]'
          git push origin "HEAD:$FEATURE_BRANCH"
