name: Apply v0.5.0 CPU5 Rescue AI Phase 2

on:
  push:
    paths:
      - '.github/workflows/apply-v050-cpu5-rescue-ai-phase2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Rescue AI branch
        uses: actions/checkout@v4
        with:
          ref: feature/cpu5-rescue-ai-phase2

      - name: Apply CPU5 Rescue AI Phase 2
        run: python3 scripts/apply_v050_cpu5_rescue_ai_phase2.py

      - name: Validate JSON and protected invariants
        run: |
          python3 -m json.tool game.json >/dev/null
          python3 - <<'PY'
          import json
          d=json.load(open('game.json',encoding='utf-8'))
          f=next(x for x in d['layouts'] if x.get('name')=='FROST LAB')
          p=next(i for i in f['instances'] if i.get('name')=='Player')
          aa=[i for i in f['instances'] if i.get('name')=='Actor']
          assert len(aa)==5
          assert (p['width'],p['height'],p['depth'])==(17,17,32)
          assert all((a['width'],a['height'],a['depth'])==(17,17,32) for a in aa)
          build=next(o for o in f['objects'] if o.get('name')=='BuildText')
          assert build.get('string')=='DEV v0.5.0'
          groups=[e for e in f.get('events',[]) if e.get('name')=='v0.5.0 CPU5 Rescue AI Phase 2']
          assert len(groups)==1
          assert not any(e.get('name')=='v0.4.0 CPU5 Escape AI Phase 1' for e in f.get('events',[]))
          group=groups[0]
          js=next(e for e in group['events'] if e.get('type')=='BuiltinCommonInstructions::JsCode')
          code='\n'.join(js.get('inlineCode',[]))
          for token in [
            'fleeRadius = 360',
            'fleeSpeed = 155',
            'wanderSpeed = 65',
            'rescueSearchRadius = 520',
            'rescueSpeed = 95',
            'rescueDistance = 34',
            'rescueDangerRadius = 360',
            "targetState !== 'Frozen' && targetState !== 'FrozenWolfCandidate'",
            "targetState === 'FrozenWolfCandidate'",
            "targetVars.get('Role').setString('Wolf')",
            "targetVars.get('State').setString('Active')",
            "actorVars.get('State').setString('Frozen')",
            'wolfVisible && Math.hypot(tx - px, ty - py) < rescueDangerRadius',
          ]:
            assert token in code, token
          fe=next(e for e in group['events'] if e.get('type')=='BuiltinCommonInstructions::ForEach' and e.get('object')=='Actor')
          sep=[(a.get('type',{}).get('value'),tuple(a.get('parameters',[]))) for a in fe.get('actions',[])]
          assert ('SeparateFromObjects',('Actor','Wall','')) in sep
          assert ('SeparateFromObjects',('Actor','Barrier','')) in sep
          raw=json.dumps(d,ensure_ascii=False,separators=(',',':'))
          for token in ['FrozenWolfCandidate','255;0;0','freeze_crack.wav','WOLF MODE ON!','TRAP! YOU ARE FROZEN','MatchDuration','v0.3.4 guaranteed solid-state visuals']:
            assert token in raw, token
          assert '"Actor","Scale","=","1.0"' not in raw
          assert '"Actor","Scale","=","1.15"' not in raw
          print('v0.5.0 static validation PASS')
          PY

      - name: Commit game.json
        run: |
          if git diff --quiet -- game.json; then
            echo 'No game.json changes detected'; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.json
          git commit -m 'feat: v0.5.0 add CPU5 rescue AI phase 2'
          git push origin HEAD:feature/cpu5-rescue-ai-phase2
