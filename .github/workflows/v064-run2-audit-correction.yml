name: v0.6.4 Run 2 Audit-Only Correction

on:
  push:
    branches:
      - feature/v064-compact-joystick-overview-camera
    paths:
      - '.github/workflows/v064-run2-audit-correction.yml'

permissions:
  contents: write

jobs:
  correct-audit-only:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact feature
        uses: actions/checkout@v4
        with:
          ref: feature/v064-compact-joystick-overview-camera
          fetch-depth: 0

      - name: Guard main and untouched game.json
        shell: bash
        run: |
          set -euo pipefail
          MAIN='45024fa159bd66291a4687c74eb29f5896b35392'
          PARENT='a08d5301b3fecf98900946354f046841910ff936'
          PARENT_GAME_BLOB='73dc5913c07813b3858acbbe456f2e5af380282c'
          git fetch origin main feature/v063-mobile-virtual-joystick --no-tags
          test "$(git rev-parse origin/main)" = "$MAIN"
          test "$(git rev-parse origin/feature/v063-mobile-virtual-joystick)" = "$PARENT"
          test "$(git hash-object game.json)" = "$PARENT_GAME_BLOB"
          git diff --quiet "$PARENT" -- game.json
          echo 'Pre-correction guard PASS: main unchanged; game.json untouched.'

      - name: Correct only the Run 1 audit comparison direction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          path='.github/workflows/v064-compact-joystick-overview-camera.yml'
          text=open(path,encoding='utf-8').read()
          old="          aj['events'][0]['inlineCode'] = expected.split('\\n')\n          assert aj == bj, 'joystick changed outside approved visual-only edits'"
          new="          bj['events'][0]['inlineCode'] = expected.split('\\n')\n          assert aj == bj, 'joystick changed outside approved visual-only edits'"
          assert text.count(old) == 1, text.count(old)
          text=text.replace(old,new,1)
          open(path,'w',encoding='utf-8').write(text)
          PY
          git diff -- .github/workflows/v064-compact-joystick-overview-camera.yml
          git diff --quiet a08d5301b3fecf98900946354f046841910ff936 -- game.json

      - name: Self-clean correction workflow and push audit-only fix
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/v064-run2-audit-correction.yml
          git add .github/workflows/v064-compact-joystick-overview-camera.yml
          git diff --cached --quiet -- game.json
          STAGED="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n' '.github/workflows/v064-compact-joystick-overview-camera.yml' '.github/workflows/v064-run2-audit-correction.yml' | sort)"
          test "$STAGED" = "$EXPECTED"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: correct v0.6.4 joystick expectation comparison [skip ci]'
          git push origin HEAD:feature/v064-compact-joystick-overview-camera
          echo 'Audit-only correction pushed; original v0.6.4 gate should now run as Run #2.'
