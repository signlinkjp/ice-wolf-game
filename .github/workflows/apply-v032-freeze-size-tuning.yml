name: Apply v0.3.2 Freeze Size Tuning

on:
  push:
    paths:
      - '.github/workflows/apply-v032-freeze-size-tuning.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.3.2 tuning
        run: python scripts/apply_v032_freeze_size_tuning.py

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          d=json.load(open('game.json', encoding='utf-8'))
          lab=next(x for x in d['layouts'] if x['name']=='FROST LAB')
          build=next(o for o in lab['objects'] if o['name']=='BuildText')
          assert build['string']=='DEV v0.3.2'
          grp=next(e for e in lab['events'] if e.get('name')=='v0.3.2 Frozen visibility enforcement')
          specs={}
          for ev in grp['events']:
              state=None
              for c in ev.get('conditions',[]):
                  p=c.get('parameters',[])
                  if c.get('type',{}).get('value')=='StringObjectVariable' and len(p)>=4 and p[:2]==['Actor','State']:
                      state=p[3].strip('"')
              if state:
                  tint=scale=None
                  for a in ev.get('actions',[]):
                      p=a.get('parameters',[]); v=a.get('type',{}).get('value')
                      if v=='ChangeColor' and p and p[0]=='Actor': tint=p[1]
                      if v=='ScalableCapability::ScalableBehavior::SetValue' and len(p)>=4 and p[:2]==['Actor','Scale']: scale=p[3]
                  specs[state]=(tint,scale)
          assert specs['Frozen']==('"0;255;255"','1.15')
          assert specs['FrozenWolfCandidate']==specs['Frozen']
          assert specs['Active']==('"255;255;255"','1.0')
          s=json.dumps(d,ensure_ascii=False)
          assert s.count('freeze_crack.wav')>=3
          print('v0.3.2 static validation PASS')
          PY

      - name: Commit tuned game.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.json
          if git diff --cached --quiet; then
            echo 'No game.json changes to commit'
            exit 0
          fi
          git commit -m 'fix: tune frozen actor size for v0.3.2'
          git push
