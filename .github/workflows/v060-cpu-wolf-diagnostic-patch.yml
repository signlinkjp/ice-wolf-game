name: v0.6.0 CPU Wolf Diagnostic Patch Gate

on:
  push:
    branches:
      - feature/v060-human-side-cpu-wolf
    paths:
      - '.github/workflows/v060-cpu-wolf-diagnostic-patch.yml'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v060-human-side-cpu-wolf
          fetch-depth: 0

      - name: Confirm exact approved main is still the merge-base
        shell: bash
        run: |
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = '84bbfe11f8f345addf3762cc277429b560cc4194'
          test "$(git rev-parse origin/main)" = '84bbfe11f8f345addf3762cc277429b560cc4194'

      - name: Apply deterministic CPU Wolf device diagnostic
        run: |
          python scripts/patch-v060-cpu-wolf-diagnostic.py
          python -m json.tool game.json > /dev/null

      - name: Static invariant gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          with open('game.json', encoding='utf-8') as f:
              data = json.load(f)
          frost = next(x for x in data['layouts'] if x.get('name') == 'FROST LAB')
          assert sum(1 for i in frost['instances'] if i.get('name') == 'Actor') == 6
          assert next(v for v in frost['variables'] if v.get('name') == 'MatchDuration')['value'] == 210
          assert next(o for o in frost['objects'] if o.get('name') == 'BuildText')['string'] == '開発版 v0.6.0-DIAG'
          assert next(o for o in frost['objects'] if o.get('name') == 'CpuWolfTestButton')['string'] == 'CPU人狼テスト'
          assert any(t.get('name') == 'v0.6.0 CPU Wolf device diagnostic test' for t in data['tests'])
          blob = json.dumps(data, ensure_ascii=False)
          for protected in ['FrozenWolfCandidate', '139;0;0', '0077FF', 'AIWolfModeLeft', 'InfectionUsed']:
              assert protected in blob, protected
          print('Static diagnostic + protected-rule gate PASS')
          PY

      - name: Install GDevelop Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libasound2t64 xvfb unzip curl

      - name: Download exact GDevelop 5.6.282 portable build
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            'https://github.com/4ian/GDevelop/releases/download/v5.6.282/GDevelop-5-5.6.282-linux.zip' \
            --output /tmp/gdevelop.zip
          echo 'c1d23616562befbde242412913785dacb0bb15a79e8c101c1553dc729b1e0472  /tmp/gdevelop.zip' | sha256sum -c -
          mkdir -p /tmp/gdevelop
          unzip -q /tmp/gdevelop.zip -d /tmp/gdevelop
          BIN="$(find /tmp/gdevelop -type f -name gdevelop -perm -u+x | head -n 1)"
          if [ -z "$BIN" ]; then
            BIN="$(find /tmp/gdevelop -type f -name gdevelop | head -n 1)"
          fi
          test -n "$BIN"
          chmod +x "$BIN"
          echo "GDEVELOP_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Run device diagnostic gameplay test in official GDevelop
        shell: bash
        run: |
          xvfb-run -a "$GDEVELOP_BIN" \
            --no-sandbox \
            --disable-update-check \
            --run-command RUN_ALL_TESTS "$GITHUB_WORKSPACE/game.json" \
            --cmd-args 'v0.6.0 CPU Wolf device diagnostic test' \
            --results-path "$GITHUB_WORKSPACE/diagnostic-test-results.json"
          test -s diagnostic-test-results.json
          cat diagnostic-test-results.json

      - name: Confirm standard HTML5 export
        shell: bash
        run: |
          rm -rf build
          xvfb-run -a "$GDEVELOP_BIN" \
            --no-sandbox \
            --disable-update-check \
            --run-command EXPORT_HTML5_EXTERNAL "$GITHUB_WORKSPACE/game.json"
          test -s build/index.html
          FILE_COUNT="$(find build -type f | wc -l)"
          test "$FILE_COUNT" -gt 5
          echo "HTML5 export PASS: $FILE_COUNT files"

      - name: Commit validated diagnostic game.json only
        shell: bash
        run: |
          git config user.name 'signlinkjp'
          git config user.email 'signlink.support@gmail.com'
          git add game.json
          git diff --cached --quiet && { echo 'No game.json changes to commit'; exit 0; }
          git commit -m 'feat: add visible CPU wolf device diagnostic'
          git push origin HEAD:feature/v060-human-side-cpu-wolf
