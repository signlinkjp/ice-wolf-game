# revision: 3
name: v0.6.1 Human CPU Navigation Recovery One-Time Gate

on:
  push:
    branches:
      - feature/v061-human-cpu-navigation-recovery
    paths:
      - '.github/workflows/v061-human-cpu-navigation-recovery.yml'

permissions:
  contents: write

jobs:
  implement-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v061-human-cpu-navigation-recovery
          fetch-depth: 0

      - name: Guard exact post-PR10 baseline and branch-only helpers
        shell: bash
        run: |
          set -euo pipefail
          BASE='cfd2aae6a48e8ad3d33e176e49ff2ede25dbaefb'
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --quiet "$BASE" -- game.json
          ACTUAL="$(git diff --name-only "$BASE"..HEAD | sort)"
          EXPECTED="$(printf '%s\n' '.github/ice-wolf/v061_transplant.py' '.github/workflows/v061-human-cpu-navigation-recovery.yml' | sort)"
          test "$ACTUAL" = "$EXPECTED"
          git show "$BASE":game.json > main-baseline.json
          python3 -m json.tool main-baseline.json >/dev/null
          echo 'Exact current-main baseline guard PASS.'

      - name: Semantically transplant Human CPU navigation recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ice-wolf/v061_transplant.py
          python3 -m json.tool game.json >/dev/null
          node --check /tmp/v061-merged-ai.js

      - name: Verify v0.6.1 structure and protected v0.6.0 tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          with open('game.json', encoding='utf-8') as f:
              data = json.load(f)
          gd = data['gdVersion']
          assert (gd['major'], gd['minor'], gd['build']) == (5, 6, 282), gd
          frost = next(x for x in data['layouts'] if x.get('name') == 'FROST LAB')
          build = next(x for x in frost['objects'] if x.get('name') == 'BuildText')
          assert build['string'] == '開発版 v0.6.1-DIAG', build.get('string')
          assert len([x for x in frost['instances'] if x.get('objectName') == 'Actor']) == 6
          raw = json.dumps(data, ensure_ascii=False)
          for marker in (
              'activeHumanTargets', 'CpuWolfDiagPhase', 'AIWolfModeLeft',
              'AIWolfCooldownLeft', '__iceWolfAIHumanBlocked',
              'v0.6.1 Human CPU Navigation Recovery + CPU Wolf Cycle',
              '診断PASS：追跡 → 凍結 → 救助'
          ):
              assert marker in raw, marker
          names = [x.get('name') for x in data.get('tests', [])]
          assert 'v0.6.0 human-side CPU Wolf test' in names, names
          assert 'v0.6.0 CPU Wolf device diagnostic test' in names, names
          print('v0.6.1 structural/protected-invariant gate PASS')
          PY

      - name: Install GDevelop Linux runtime dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libasound2t64 xvfb unzip curl

      - name: Download exact GDevelop 5.6.282 portable build
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/4ian/GDevelop/releases/download/v5.6.282/GDevelop-5-5.6.282-linux.zip' \
            --output /tmp/gdevelop.zip
          echo 'c1d23616562befbde242412913785dacb0bb15a79e8c101c1553dc729b1e0472  /tmp/gdevelop.zip' | sha256sum -c -
          mkdir -p /tmp/gdevelop
          unzip -q /tmp/gdevelop.zip -d /tmp/gdevelop
          BIN="$(find /tmp/gdevelop -type f -name gdevelop -perm -u+x | head -n 1)"
          if [ -z "$BIN" ]; then
            BIN="$(find /tmp/gdevelop -type f -name gdevelop | head -n 1)"
          fi
          test -n "$BIN"
          chmod +x "$BIN"
          echo "GDEVELOP_BIN=$BIN" >> "$GITHUB_ENV"
          echo "GDevelop binary: $BIN"

      - name: Run Human-side CPU Wolf regression test in GDevelop
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a "$GDEVELOP_BIN" \
            --no-sandbox \
            --disable-update-check \
            --run-command RUN_ALL_TESTS "$GITHUB_WORKSPACE/game.json" \
            --cmd-args 'v0.6.0 human-side CPU Wolf test' \
            --results-path "$GITHUB_WORKSPACE/human-side-results.json"
          test -s human-side-results.json

      - name: Run CPU Wolf device-diagnostic regression test in GDevelop
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a "$GDEVELOP_BIN" \
            --no-sandbox \
            --disable-update-check \
            --run-command RUN_ALL_TESTS "$GITHUB_WORKSPACE/game.json" \
            --cmd-args 'v0.6.0 CPU Wolf device diagnostic test' \
            --results-path "$GITHUB_WORKSPACE/cpu-wolf-diag-results.json"
          test -s cpu-wolf-diag-results.json

      - name: Prove strict diagnostic debt is unchanged from exact current main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          set +e
          xvfb-run -a "$GDEVELOP_BIN" \
            --no-sandbox \
            --disable-update-check \
            --block-on-diagnostic-errors \
            --run-command EXPORT_HTML5_EXTERNAL "$GITHUB_WORKSPACE/game.json" \
            > feature-strict.log 2>&1
          FEATURE_STATUS=$?
          set -e
          cat feature-strict.log
          test "$FEATURE_STATUS" -ne 0
          grep -Fq '[CLI] Diagnostic report has 14 error(s). Export blocked.' feature-strict.log

          rm -rf build
          set +e
          xvfb-run -a "$GDEVELOP_BIN" \
            --no-sandbox \
            --disable-update-check \
            --block-on-diagnostic-errors \
            --run-command EXPORT_HTML5_EXTERNAL "$GITHUB_WORKSPACE/main-baseline.json" \
            > baseline-strict.log 2>&1
          BASELINE_STATUS=$?
          set -e
          cat baseline-strict.log
          test "$BASELINE_STATUS" -ne 0
          grep -Fq '[CLI] Diagnostic report has 14 error(s). Export blocked.' baseline-strict.log
          echo 'Strict diagnostic provenance PASS: feature=14, current main=14.'

      - name: Export v0.6.1 HTML5 using standard GDevelop export
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          xvfb-run -a "$GDEVELOP_BIN" \
            --no-sandbox \
            --disable-update-check \
            --run-command EXPORT_HTML5_EXTERNAL "$GITHUB_WORKSPACE/game.json"
          test -s build/index.html
          FILE_COUNT="$(find build -type f | wc -l)"
          test "$FILE_COUNT" -gt 5
          echo "HTML5 standard export PASS: $FILE_COUNT files"

      - name: Commit only final game.json and self-clean one-time helpers
        shell: bash
        run: |
          set -euo pipefail
          BASE='cfd2aae6a48e8ad3d33e176e49ff2ede25dbaefb'
          rm -f main-baseline.json human-side-results.json cpu-wolf-diag-results.json feature-strict.log baseline-strict.log
          rm -rf build
          git rm .github/ice-wolf/v061_transplant.py
          git rm .github/workflows/v061-human-cpu-navigation-recovery.yml
          git add game.json
          STAGED="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n' '.github/ice-wolf/v061_transplant.py' '.github/workflows/v061-human-cpu-navigation-recovery.yml' 'game.json' | sort)"
          test "$STAGED" = "$EXPECTED"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add v0.6.1 Human CPU navigation recovery [skip ci]'
          git push origin HEAD:feature/v061-human-cpu-navigation-recovery
          FINAL="$(git diff --name-only "$BASE"..HEAD)"
          test "$FINAL" = 'game.json'
          test ! -e .github/ice-wolf/v061_transplant.py
          test ! -e .github/workflows/v061-human-cpu-navigation-recovery.yml
          test -z "$(git status --porcelain)"
          echo 'Final branch proof PASS: net delta vs current main is game.json only.'
