name: v0.6.5 Wolf Mode Multi-Freeze Feedback

on:
  push:
    branches:
      - feature/v065-production-round-start
    paths:
      - .github/workflows/v065-multifreeze-feedback.yml

permissions:
  contents: write

jobs:
  patch-test-export-preview-cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'remove v0.6.5 multi-freeze feedback helper') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_SHA: 9c24143327abfb2bdd9a6a9b0d13cd2f1422eea1
      PRE_FEEDBACK_HEAD: ec003356f33161fe3b23252ae09f2649d2e291ee
      EXPECTED_FEATURE_HEAD: b5b56a691cb5948bcf3c4ccfbcd431d746509073
      FEATURE_BRANCH: feature/v065-production-round-start
      PREVIEW_BRANCH: preview-v065-production-round-start
      GDEVELOP_SHA256: c1d23616562befbde242412913785dacb0bb15a79e8c101c1553dc729b1e0472
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v065-production-round-start
          fetch-depth: 0

      - name: Guard baseline and expected parent head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$FEATURE_BRANCH"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_FEATURE_HEAD"
          test "$(git diff --name-only "$EXPECTED_FEATURE_HEAD"..HEAD)" = ".github/workflows/v065-multifreeze-feedback.yml"
          git cat-file -e "$PRE_FEEDBACK_HEAD^{commit}"
          git show "$PRE_FEEDBACK_HEAD:game.json" > /tmp/pre-feedback-game.json
          node <<'NODE'
          const game = JSON.parse(require('fs').readFileSync('game.json','utf8'));
          if (game.firstLayout !== 'FROST LAB') throw new Error(`firstLayout=${JSON.stringify(game.firstLayout)}`);
          if (!game.layouts.some(x => x.name === 'FROST LAB')) throw new Error('FROST LAB missing');
          console.log('baseline/startup guard PASS');
          NODE

      - name: Apply minimal Wolf Mode multi-freeze patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          path=Path('game.json'); data=json.loads(path.read_text(encoding='utf-8'))
          frost=next(x for x in data['layouts'] if x.get('name')=='FROST LAB')
          wolf_group=next(x for x in frost['events'] if x.get('type')=='BuiltinCommonInstructions::Group' and x.get('name')=='Wolf actions')
          def walk(events):
              for ev in events or []:
                  yield ev
                  yield from walk(ev.get('events',[]))
          freeze_events=[]
          for ev in walk(wolf_group.get('events',[])):
              acts=ev.get('actions',[])
              has_freeze=any(a.get('type',{}).get('value')=='SetStringObjectVariable' and a.get('parameters',[None,None,None,None])[:4]==['Actor','State','=','\"Frozen\"'] for a in acts)
              has_sound=any(a.get('type',{}).get('value')=='PlaySound' and len(a.get('parameters',[]))>1 and a['parameters'][1]=='freeze_crack.wav' for a in acts)
              if has_freeze and has_sound: freeze_events.append(ev)
          assert len(freeze_events)==1, f'Player freeze event count={len(freeze_events)}'
          freeze=freeze_events[0]; removed=[]; kept=[]
          for a in freeze['actions']:
              t=a.get('type',{}).get('value'); p=a.get('parameters',[])
              if t=='SetNumberVariable' and p and p[0] in ('WolfModeLeft','CooldownLeft'):
                  removed.append((t,p)); continue
              if t=='ChangeColor' and len(p)>=2 and p[0]=='Player' and p[1]=='\"255;255;255\"':
                  removed.append((t,p)); continue
              kept.append(a)
          assert len(removed)==3, f'intended action removals={removed}'
          freeze['actions']=kept

          how_old='<li>人狼：人狼モード中に接触して人間を凍らせる。</li>'
          how_new='<li>人狼：5秒間の人狼モード中は、接触した人間を連続で凍らせられる。</li>'
          replacements=0
          for ev in walk(frost.get('events',[])):
              if ev.get('type')!='BuiltinCommonInstructions::JsCode': continue
              for i,line in enumerate(ev.get('inlineCode',[])):
                  if how_old in line:
                      ev['inlineCode'][i]=line.replace(how_old,how_new); replacements+=1
          assert replacements==1, f'HOW TO PLAY replacement count={replacements}'

          tests=data.setdefault('tests',[])
          core=next(t for t in tests if t.get('name')=='STEP2 core test'); src=core['source']
          old="harness.assert(wm === 0, `E mode ends after one freeze`);"
          assert src.count(old)==1
          src[src.index(old)]="harness.assert(wm > 0, `E wolf mode remains active after first freeze (${wm})`);"
          old2="harness.assert(avar(t1.id,'State') === 'Active', `E no chain freeze`);"
          assert src.count(old2)==1
          i=src.index(old2)
          src[i:i+1]=[
              "harness.assert(avar(t1.id,'State') === 'Active', `E second target remains Active without contact`);",
              "harness.setSceneVariable('WolfModeLeft', 0);",
              "harness.setSceneVariable('CooldownLeft', 0);",
              "await harness.stepFrames(3);",
          ]
          if "harness.setSceneVariable('MatchTimeLeft', 1.5);" in src:
              src[src.index("harness.setSceneVariable('MatchTimeLeft', 1.5);")]="harness.setSceneVariable('MatchTimeLeft', 0.2);"
          if "await harness.stepFrames(150);" in src:
              src[src.index("await harness.stepFrames(150);")]="await harness.stepFrames(20);"

          multi='v0.6.5 Wolf Mode Multi-Freeze test'; timeout='v0.6.5 Human Timeout Win Fast test'
          tests[:]=[t for t in tests if t.get('name') not in (multi,timeout)]
          tests.append({'description':'Player Wolf keeps the full 5-second Wolf Mode after a freeze and can freeze multiple Active Humans before cooldown starts','lastRunAt':0,'lastRunDurationMs':0,'lastRunFramesExecuted':0,'lastRunStatus':'not-run','name':multi,'type':'gameplay','source':[
              "await harness.goToScene('FROST LAB');",
              "harness.setSceneVariable('RoundCommand', 'TestStartWolf');","await harness.stepFrames(3);","await harness.stepFrames(12);",
              "harness.assert((harness.getSceneVariable('WolfModeDuration')?.value ?? 0) === 5, 'Wolf Mode duration remains 5 seconds');",
              "harness.assert((harness.getSceneVariable('WolfCooldown')?.value ?? 0) === 5, 'Wolf cooldown remains 5 seconds');",
              "harness.setSceneVariable('WolfModeLeft', 5);","harness.setSceneVariable('CooldownLeft', 0);",
              "const actorIds = harness.getObjects('Actor').slice(0,3).map(a => a.id);","harness.assert(actorIds.length === 3, 'three human targets available');",
              "for (let i = 0; i < actorIds.length; i++) {","  const target = harness.getObjects('Actor').find(a => a.id === actorIds[i]);","  const playerNow = harness.getObjects('Player')[0];",
              "  harness.assert(!!target && !!playerNow, `target/player ${i} exists`);","  harness.assert(harness.getObjectVariable(target.id, 'Role')?.value === 'Human', `target ${i} is Human`);","  harness.assert(harness.getObjectVariable(target.id, 'State')?.value === 'Active', `target ${i} starts Active`);",
              "  harness.setObjectPosition(playerNow.id, target.centerX - 8.5, target.centerY - 8.5);","  await harness.stepFrames(8);","  harness.assert(harness.getObjectVariable(target.id, 'State')?.value === 'Frozen', `target ${i} frozen in same Wolf Mode`);","  harness.assert((harness.getSceneVariable('WolfModeLeft')?.value ?? 0) > 0, `Wolf Mode remains active after target ${i}`);","}",
              "const frozen = harness.getObjects('Actor').filter(a => harness.getObjectVariable(a.id, 'State')?.value === 'Frozen');","harness.assert(frozen.length >= 3, `at least 3 humans frozen during one Wolf Mode, got ${frozen.length}`);",
              "harness.setSceneVariable('WolfModeLeft', 0.01);","await harness.stepFrames(8);","harness.assert((harness.getSceneVariable('WolfModeLeft')?.value ?? -1) === 0, 'Wolf Mode expires normally');","harness.assert((harness.getSceneVariable('CooldownLeft')?.value ?? 0) > 0, 'cooldown starts only after Wolf Mode expires');",""
          ]})
          tests.append({'description':'Fast isolated regression for Human victory when match timer reaches zero','lastRunAt':0,'lastRunDurationMs':0,'lastRunFramesExecuted':0,'lastRunStatus':'not-run','name':timeout,'type':'gameplay','source':[
              "await harness.goToScene('FROST LAB');","harness.setSceneVariable('RoundCommand', 'TestStartWolf');","await harness.stepFrames(3);","harness.setSceneVariable('MatchTimeLeft', 0.05);","await harness.stepFrames(8);","harness.assert(harness.getSceneVariable('GameOver')?.value === true, 'timer expiry ends match');","harness.assert(harness.getObjects('WinText')[0].text === '人間の勝利', 'timer expiry awards Human victory');",""
          ]})
          path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('multi-freeze patch PASS')
          PY

      - name: Exact intended-delta structural audit
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const before=JSON.parse(fs.readFileSync('/tmp/pre-feedback-game.json','utf8'));
          const after=JSON.parse(fs.readFileSync('game.json','utf8'));
          if(after.firstLayout!=='FROST LAB') throw new Error('startup scene drift');
          const b=before.layouts.find(x=>x.name==='FROST LAB'); const a=after.layouts.find(x=>x.name==='FROST LAB');
          const allowed=new Set(['Wolf actions','v0.6.5 Production Round Start + Main Menu']);
          for(const be of b.events){
            if(!be.name || allowed.has(be.name)) continue;
            const ae=a.events.find(e=>e.name===be.name);
            if(!ae || JSON.stringify(ae)!==JSON.stringify(be)) throw new Error(`unrelated event group drift: ${be.name}`);
          }
          const stripEvents=s=>{const c=structuredClone(s);delete c.events;return c;};
          if(JSON.stringify(stripEvents(a))!==JSON.stringify(stripEvents(b))) throw new Error('FROST LAB non-event structure drift');
          const bw=b.events.find(e=>e.name==='Wolf actions'); const aw=a.events.find(e=>e.name==='Wolf actions');
          const clone=structuredClone(bw);
          const walk=es=>{const out=[];for(const e of es||[]){out.push(e,...walk(e.events));}return out;};
          const targets=walk(clone.events).filter(e=>{
            const acts=e.actions||[];
            return acts.some(x=>x.type?.value==='SetStringObjectVariable'&&JSON.stringify(x.parameters?.slice(0,4))===JSON.stringify(['Actor','State','=','\"Frozen\"']))&&acts.some(x=>x.type?.value==='PlaySound'&&x.parameters?.[1]==='freeze_crack.wav');
          });
          if(targets.length!==1) throw new Error('baseline freeze event ambiguous');
          targets[0].actions=targets[0].actions.filter(x=>{
            const t=x.type?.value,p=x.parameters||[];
            if(t==='SetNumberVariable'&&(p[0]==='WolfModeLeft'||p[0]==='CooldownLeft')) return false;
            if(t==='ChangeColor'&&p[0]==='Player'&&p[1]==='\"255;255;255\"') return false;
            return true;
          });
          if(JSON.stringify(clone)!==JSON.stringify(aw)) throw new Error('Wolf actions changed beyond intended multi-freeze delta');
          const bp=b.events.find(e=>e.name==='v0.6.5 Production Round Start + Main Menu'); const ap=a.events.find(e=>e.name==='v0.6.5 Production Round Start + Main Menu');
          const expected=JSON.stringify(bp).replace('人狼：人狼モード中に接触して人間を凍らせる。','人狼：5秒間の人狼モード中は、接触した人間を連続で凍らせられる。');
          if(expected!==JSON.stringify(ap)) throw new Error('Production UI changed beyond HOW TO PLAY wording');
          if(!after.tests.some(t=>t.name==='v0.6.5 Wolf Mode Multi-Freeze test')) throw new Error('multi-freeze test missing');
          if(!after.tests.some(t=>t.name==='v0.6.5 Human Timeout Win Fast test')) throw new Error('timeout test missing');
          console.log('exact intended-delta audit PASS');
          NODE

      - name: Install GDevelop runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y libnss3 libasound2t64 xvfb unzip curl >/dev/null

      - name: Download exact GDevelop 5.6.282
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/gdevelop.zip "https://github.com/4ian/GDevelop/releases/download/v5.6.282/GDevelop-5-5.6.282-linux.zip" >/dev/null
          echo "$GDEVELOP_SHA256  /tmp/gdevelop.zip" | sha256sum -c -
          mkdir -p /tmp/gdevelop
          unzip -q /tmp/gdevelop.zip -d /tmp/gdevelop
          GDEVELOP_BIN="$(find /tmp/gdevelop -type f -name gdevelop -perm -111 | head -n 1)"
          test -n "$GDEVELOP_BIN"
          echo "GDEVELOP_BIN=$GDEVELOP_BIN" >> "$GITHUB_ENV"

      - name: Run new feedback tests
        shell: bash
        run: |
          set -euo pipefail
          for test_name in 'v0.6.5 Wolf Mode Multi-Freeze test' 'v0.6.5 Human Timeout Win Fast test' 'v0.6.5 Production Round Start test'; do
            echo "=== $test_name ==="
            rm -f gameplay-test-results.json
            xvfb-run -a "$GDEVELOP_BIN" --no-sandbox --disable-update-check --run-command RUN_ALL_TESTS "$GITHUB_WORKSPACE/game.json" --cmd-args "$test_name"
            test -f gameplay-test-results.json
            cat gameplay-test-results.json
          done

      - name: Run canonical protected regression suite
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            'v0.6.4 Device Tuning liveness test'
            'v0.6.4 Compact Joystick + Overview Camera test'
            'v0.6.3 Mobile Virtual Joystick test'
            'Stability self-test'
            'v0.6.2 Color-independent Actor ID Labels test'
            'v0.6.1 Human CPU navigation recovery test'
            'v0.6.0 human-side CPU Wolf test'
            'v0.6.0 CPU Wolf device diagnostic test'
          )
          for test_name in "${tests[@]}"; do
            echo "=== $test_name ==="
            rm -f gameplay-test-results.json
            xvfb-run -a "$GDEVELOP_BIN" --no-sandbox --disable-update-check --run-command RUN_ALL_TESTS "$GITHUB_WORKSPACE/game.json" --cmd-args "$test_name"
            test -f gameplay-test-results.json
            cat gameplay-test-results.json
          done

      - name: Confirm audited diagnostic transition 14 to 13
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pre-strict /tmp/post-strict
          mkdir -p /tmp/pre-strict /tmp/post-strict
          set +e
          (cd /tmp/pre-strict && xvfb-run -a "$GDEVELOP_BIN" --no-sandbox --disable-update-check --block-on-diagnostic-errors --run-command EXPORT_HTML5_EXTERNAL /tmp/pre-feedback-game.json) > /tmp/pre-strict.log 2>&1
          pre_rc=$?
          (cd /tmp/post-strict && xvfb-run -a "$GDEVELOP_BIN" --no-sandbox --disable-update-check --block-on-diagnostic-errors --run-command EXPORT_HTML5_EXTERNAL "$GITHUB_WORKSPACE/game.json") > /tmp/post-strict.log 2>&1
          post_rc=$?
          set -e
          test "$pre_rc" -ne 0 && test "$post_rc" -ne 0
          python3 <<'PY'
          import re
          from pathlib import Path
          pattern=re.compile(r'Diagnostic report has (\d+) error\(s\)\. Export blocked\.')
          def count(path):
              hits=pattern.findall(Path(path).read_text(encoding='utf-8',errors='replace'))
              if len(hits)!=1:
                  raise SystemExit(f'{path}: diagnostic count marker hits={hits}')
              return int(hits[0])
          pre=count('/tmp/pre-strict.log')
          post=count('/tmp/post-strict.log')
          print(f'audited diagnostic transition: {pre} -> {post}')
          if pre != 14:
              raise SystemExit(f'pre-feedback diagnostic count drifted: {pre} != 14')
          if post != 13:
              raise SystemExit(f'multi-freeze candidate diagnostic count drifted: {post} != 13')
          if post > pre:
              raise SystemExit(f'diagnostic debt increased: {pre} -> {post}')
          print('diagnostic gate PASS: no new diagnostic debt')
          PY

      - name: Export HTML5 preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build /tmp/v065-multifreeze-build
          xvfb-run -a "$GDEVELOP_BIN" --no-sandbox --disable-update-check --run-command EXPORT_HTML5_EXTERNAL "$GITHUB_WORKSPACE/game.json"
          test -f build/index.html && test -f build/code0.js
          cp -a build /tmp/v065-multifreeze-build

      - name: Recheck main drift before write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"

      - name: Commit gameplay feedback patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add game.json
          test "$(git diff --cached --name-only)" = "game.json"
          git commit -m 'fix: allow multi-freeze during Wolf Mode'
          git push origin "HEAD:$FEATURE_BRANCH"
          echo "FEATURE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Refresh iPhone preview branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$PREVIEW_BRANCH"
          rm -rf /tmp/preview-worktree
          git worktree add --detach /tmp/preview-worktree "origin/$PREVIEW_BRANCH"
          cd /tmp/preview-worktree
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/v065-multifreeze-build/. .
          printf 'ICE WOLF v0.6.5 preview\nsource branch: %s\nsource commit: %s\nbaseline: %s\nstartup scene: FROST LAB\nfeedback: 5-second Wolf Mode multi-freeze\n' "$FEATURE_BRANCH" "$FEATURE_HEAD" "$BASE_SHA" > PREVIEW_SOURCE.txt
          git add -A
          git commit -m 'preview: refresh v0.6.5 Wolf Mode multi-freeze [skip ci]'
          git push origin "HEAD:$PREVIEW_BRANCH"

      - name: Final no-drift check and cleanup helpers
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git fetch origin main "$FEATURE_BRANCH"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git checkout "$FEATURE_BRANCH"
          git pull --ff-only origin "$FEATURE_BRANCH"
          git rm .github/workflows/v065-multifreeze-feedback.yml
          git rm .github/workflows/v065-step2-diagnostic.yml
          git rm diagnostics/step2-multifreeze.json diagnostics/step2-multifreeze-exit.txt
          git commit -m 'chore: remove v0.6.5 multi-freeze feedback helper [skip ci]'
          git push origin "HEAD:$FEATURE_BRANCH"