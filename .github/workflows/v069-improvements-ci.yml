name: ICE WOLF v0.6.9 Visual Round Once

on:
  push:
    branches:
      - feature/v065-production-round-start
    paths:
      - .github/workflows/v069-improvements-ci.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    if: ${{ !contains(github.event.head_commit.message, 'remove visual round ci helper') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v065-production-round-start
          fetch-depth: 0
      - name: Run gameplay verification and preview publish
        run: bash scripts/v069/run-v069-improvements-ci.sh
