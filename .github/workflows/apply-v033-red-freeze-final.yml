name: Apply v0.3.3 Red Freeze Final

on:
  push:
    paths:
      - '.github/workflows/apply-v033-red-freeze-final.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/v0.3-action-clarity
      - name: Apply v0.3.3 tuning
        run: python3 scripts/apply_v033_red_freeze_size_parity.py
      - name: Validate JSON and v0.3.3 structure
        run: |
          python3 -m json.tool game.json >/dev/null
          python3 - <<'PY'
          import json
          d=json.load(open('game.json',encoding='utf-8'))
          f=next(x for x in d['layouts'] if x.get('name')=='FROST LAB')
          p=next(i for i in f['instances'] if i.get('name')=='Player')
          aa=[i for i in f['instances'] if i.get('name')=='Actor']
          assert len(aa)==5
          assert all((a['width'],a['height'],a['depth'])==(p['width'],p['height'],p['depth']) for a in aa)
          build=next(o for o in f['objects'] if o.get('name')=='BuildText')
          assert build.get('string')=='DEV v0.3.3'
          assert build.get('content',{}).get('text')=='DEV v0.3.3'
          def walk(events):
              for ev in events:
                  yield ev
                  yield from walk(ev.get('events',[]))
          color_actions=[]
          scale_actions=[]
          for ev in walk(f.get('events',[])):
              for a in ev.get('actions',[]):
                  t=a.get('type',{}).get('value')
                  pms=a.get('parameters',[])
                  if t=='ChangeColor' and len(pms)>=2 and pms[0] in {'Actor','Player'}:
                      color_actions.append(tuple(pms))
                  if t=='ScalableCapability::ScalableBehavior::SetValue' and len(pms)>=4 and pms[0]=='Actor' and pms[1]=='Scale':
                      scale_actions.append(tuple(pms))
          assert any(x[0]=='Actor' and x[1]=='"255;0;0"' for x in color_actions)
          assert any(x[0]=='Player' and x[1]=='"255;0;0"' for x in color_actions)
          assert not any(x[1]=='"0;255;255"' for x in color_actions)
          assert not any(x[3]=='1.15' for x in scale_actions)
          assert any(x[3]=='1.0' for x in scale_actions)
          print('v0.3.3 structural validation PASS')
          PY
      - name: Commit tuned game.json
        run: |
          if git diff --quiet -- game.json; then
            echo 'No game.json changes detected'; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.json
          git commit -m 'fix: v0.3.3 red frozen state and actor size parity'
          git push origin HEAD:feature/v0.3-action-clarity
