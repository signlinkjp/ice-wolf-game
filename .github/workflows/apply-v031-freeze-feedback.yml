name: Apply v0.3.1 Freeze Feedback

on:
  push:
    branches:
      - feature/v0.3-action-clarity
    paths:
      - scripts/apply_v031_freeze_feedback.py
      - .github/workflows/apply-v031-freeze-feedback.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3-action-clarity
      - name: Apply migration
        run: python scripts/apply_v031_freeze_feedback.py
      - name: Validate JSON
        run: python -m json.tool game.json >/dev/null
      - name: Static assertions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('game.json',encoding='utf-8'))
          l=next(x for x in d['layouts'] if x['name']=='FROST LAB')
          names={o['name'] for o in l['objects']}
          assert 'BuildText' in names
          assert any(e.get('name')=='v0.3.1 Frozen visibility enforcement' for e in l['events'])
          assert any(r.get('name')=='freeze_crack.wav' for r in d['resources']['resources'])
          p=Path('assets/freeze_crack.wav')
          assert p.exists() and p.stat().st_size > 10000
          print('v0.3.1 static validation PASS')
          PY
      - name: Commit generated project and sound asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.json assets/freeze_crack.wav
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat: strengthen frozen visual and audio feedback"
          git push
