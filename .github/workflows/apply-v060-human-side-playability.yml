name: ICE WOLF v0.6.0 Human-Side Playability Apply

on:
  push:
    branches:
      - feature/v060-human-side-playability
    paths:
      - .github/workflows/apply-v060-human-side-playability.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v060-human-side-playability
          fetch-depth: 0

      - name: Guard exact v0.5.4 baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE="84bbfe11f8f345addf3762cc277429b560cc4194"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          CHANGED="$(git diff --name-only "$BASE"...HEAD)"
          test "$CHANGED" = ".github/workflows/apply-v060-human-side-playability.yml"

      - name: Apply clean v0.6.0 Human-Side Playability patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          path = Path("game.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          def one(items, pred, label):
              hits = [x for x in items if pred(x)]
              if len(hits) != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {len(hits)}")
              return hits[0]

          scene = one(data.get("layouts", []), lambda x: x.get("name") == "FROST LAB", "FROST LAB")
          actors = [x for x in scene.get("instances", []) if x.get("name") == "Actor"]
          if len(actors) != 6:
              raise SystemExit(f"expected exact v0.5.4 baseline with 6 Actors; got {len(actors)}")

          # Version-facing labels only. Runtime match duration is already 210 seconds.
          build = one(scene.get("objects", []), lambda x: x.get("name") == "BuildText", "BuildText")
          if build.get("string") != "開発版 v0.5.4" or build.get("content", {}).get("text") != "開発版 v0.5.4":
              raise SystemExit("unexpected BuildText baseline")
          build["string"] = "開発版 v0.6.0"
          build["content"]["text"] = "開発版 v0.6.0"

          timer = one(scene.get("objects", []), lambda x: x.get("name") == "TimerText", "TimerText")
          if timer.get("string") != "5:00" or timer.get("content", {}).get("text") != "5:00":
              raise SystemExit("unexpected TimerText baseline")
          timer["string"] = "3:30"
          timer["content"]["text"] = "3:30"

          def condition_is_clicked(event: dict, object_name: str) -> bool:
              for condition in event.get("conditions", []):
                  ctype = condition.get("type", {}).get("value")
                  params = condition.get("parameters", [])
                  if ctype == "ButtonStates::ButtonFSM::IsClicked" and params and params[0] == object_name:
                      return True
              return False

          # When Player switches to Human, create exactly one primary CPU Wolf.
          # Switching back to Wolf restores every Actor to Human.
          wolf_actions = one(scene.get("events", []), lambda e: e.get("name") == "Wolf actions", "Wolf actions")
          role_toggle = one(wolf_actions.get("events", []), lambda e: condition_is_clicked(e, "TestRoleButton"), "TestRoleButton event")
          if any(
              "__iceWolfPrimaryCPUWolf" in line
              for child in role_toggle.get("events", [])
              if child.get("type") == "BuiltinCommonInstructions::JsCode"
              for line in child.get("inlineCode", [])
          ):
              raise SystemExit("human-side role setup already present")

          role_setup_code = [
              "const players = runtimeScene.getObjects('Player');",
              "const actors = runtimeScene.getObjects('Actor');",
              "const player = players.length ? players[0] : null;",
              "if (player) {",
              "  const role = player.getVariables().get('Role').getAsString();",
              "  for (const actor of actors) {",
              "    const av = actor.getVariables();",
              "    av.get('Role').setString('Human');",
              "    av.get('State').setString('Active');",
              "    av.get('AIWolfModeLeft').setNumber(0);",
              "    av.get('AIWolfCooldownLeft').setNumber(0);",
              "    actor.__iceWolfPrimaryCPUWolf = false;",
              "  }",
              "  if (role === 'Human' && actors.length > 0) {",
              "    const chosenIndex = Math.floor(Math.random() * actors.length);",
              "    const wolf = actors[chosenIndex];",
              "    const wv = wolf.getVariables();",
              "    wv.get('Role').setString('Wolf');",
              "    wv.get('State').setString('Active');",
              "    wv.get('AIWolfModeLeft').setNumber(0);",
              "    wv.get('AIWolfCooldownLeft').setNumber(1.5);",
              "    wolf.__iceWolfPrimaryCPUWolf = true;",
              "  }",
              "}",
          ]
          role_toggle.setdefault("events", []).append({
              "type": "BuiltinCommonInstructions::JsCode",
              "inlineCode": role_setup_code,
              "parameterObjects": "",
              "useStrict": True,
              "eventsSheetExpanded": False,
              "actions": [],
          })

          # Human CPU rescue AI may rescue a frozen Human Player using the same
          # search radius / danger avoidance / rescue distance as Actor targets.
          ai_group = one(scene.get("events", []), lambda e: e.get("name") == "v0.5.2 CPU5 Rescue AI + Repeat Wolf Cycle", "CPU AI group")
          ai_js = one(ai_group.get("events", []), lambda e: e.get("type") == "BuiltinCommonInstructions::JsCode", "CPU AI JavaScript")
          lines = ai_js.get("inlineCode", [])
          if any("playerStateNow === 'Frozen'" in line for line in lines):
              raise SystemExit("player rescue patch already present")
          needle_index = next((i for i, line in enumerate(lines) if line.strip() == "let rescueTargetDist = Infinity;"), None)
          if needle_index is None:
              raise SystemExit("rescue target insertion point not found")
          indent = lines[needle_index][: len(lines[needle_index]) - len(lines[needle_index].lstrip())]
          player_rescue_lines = [
              f"{indent}const playerStateNow = pVars.get('State').getAsString();",
              f"{indent}if (pRole === 'Human' && playerStateNow === 'Frozen') {{",
              f"{indent}  const pd = Math.hypot(px - ax, py - ay);",
              f"{indent}  if (pd <= rescueSearchRadius) {{",
              f"{indent}    rescueTarget = player;",
              f"{indent}    rescueTargetDist = pd;",
              f"{indent}  }}",
              f"{indent}}}",
          ]
          lines[needle_index + 1:needle_index + 1] = player_rescue_lines

          # Refresh stale STEP2 assumptions to the actual v0.5.4 rules.
          step2 = one(data.get("tests", []), lambda t: t.get("name") == "STEP2 core test", "STEP2 core test")
          source = step2.get("source", [])
          replacements = {
              "// C1 C2: 6 actors, Wolf1/Human5": "// C1 C2: 7 participants, Player Wolf + 6 Human Actors",
              "harness.assert(actors().length === 5, `C1 5 test actors + player, got ${actors().length}`);": "harness.assert(actors().length === 6, `C1 6 actors + player, got ${actors().length}`);",
              "harness.assert(ttxt.text === '5:00' || ttxt.text === '4:59', `K timer ticking, got ${ttxt.text}`);": "harness.assert(ttxt.text === '3:30' || ttxt.text === '3:29', `K timer ticking, got ${ttxt.text}`);",
              "// L wolf win: freeze 4 via setup, 1 via play": "// L wolf win: freeze 5 via setup, 1 via play",
              "for (let i = 0; i < 4; i++) harness.setObjectVariable(list[i].id, 'State', 'Frozen');": "for (let i = 0; i < 5; i++) harness.setObjectVariable(list[i].id, 'State', 'Frozen');",
              "const last = actors()[4];": "const last = actors()[5];",
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f"STEP2 baseline line expected once: {old}")
              source[source.index(old)] = new
          step2["lastRunAt"] = 0
          step2["lastRunDurationMs"] = 0
          step2["lastRunFramesExecuted"] = 0
          step2["lastRunStatus"] = "not-run"

          # Targeted gameplay regression test for the new human-side loop.
          if any(t.get("name") == "v0.6.0 human-side CPU Wolf test" for t in data.get("tests", [])):
              raise SystemExit("v0.6.0 gameplay test already exists")
          new_test = {
              "description": "Human role creates one CPU Wolf; CPU Wolf can freeze Player; Human CPU can rescue frozen Player; switching back restores Actor roles",
              "lastRunAt": 0,
              "lastRunDurationMs": 0,
              "lastRunFramesExecuted": 0,
              "lastRunStatus": "not-run",
              "name": "v0.6.0 human-side CPU Wolf test",
              "type": "gameplay",
              "source": [
                  "await harness.goToScene('FROST LAB');",
                  "await harness.stepFrames(30);",
                  "async function click(x, y) {",
                  "  harness.setMousePosition(x, y, 'UI');",
                  "  await harness.stepFrames(2);",
                  "  harness.setMouseButtonPressed(true);",
                  "  await harness.stepFrames(2);",
                  "  harness.setMouseButtonPressed(false);",
                  "  await harness.stepFrames(3);",
                  "}",
                  "const actors = () => harness.getObjects('Actor');",
                  "const pvar = (n) => harness.getObjectVariable('Player', n)?.value;",
                  "const avar = (id, n) => harness.getObjectVariable(id, n)?.value;",
                  "harness.assert(actors().length === 6, `six Actors exist, got ${actors().length}`);",
                  "await click(1190, 622);",
                  "harness.assert(pvar('Role') === 'Human', 'Player switched to Human');",
                  "let wolfActors = actors().filter(a => avar(a.id, 'Role') === 'Wolf' && avar(a.id, 'State') === 'Active');",
                  "let humanActors = actors().filter(a => avar(a.id, 'Role') === 'Human' && avar(a.id, 'State') === 'Active');",
                  "harness.assert(wolfActors.length === 1, `exactly one primary CPU Wolf, got ${wolfActors.length}`);",
                  "harness.assert(humanActors.length === 5, `five Human CPU allies, got ${humanActors.length}`);",
                  "const player = harness.getObjects('Player')[0];",
                  "const wolf = wolfActors[0];",
                  "harness.setObjectVariable(wolf.id, 'AIWolfCooldownLeft', 0);",
                  "harness.setObjectVariable(wolf.id, 'AIWolfModeLeft', 0);",
                  "harness.setObjectPosition(wolf.id, player.centerX + 10, player.centerY);",
                  "await harness.stepFrames(20);",
                  "harness.assert(pvar('State') === 'Frozen', 'CPU Wolf can freeze Human Player');",
                  "harness.setObjectPosition(wolf.id, -650, -650);",
                  "harness.setObjectVariable(wolf.id, 'AIWolfModeLeft', 0);",
                  "harness.setObjectVariable(wolf.id, 'AIWolfCooldownLeft', 999);",
                  "humanActors = actors().filter(a => avar(a.id, 'Role') === 'Human' && avar(a.id, 'State') === 'Active');",
                  "const rescuer = humanActors[0];",
                  "const frozenPlayer = harness.getObjects('Player')[0];",
                  "harness.setObjectPosition(rescuer.id, frozenPlayer.centerX + 10, frozenPlayer.centerY);",
                  "await harness.stepFrames(30);",
                  "harness.assert(pvar('State') === 'Active', 'Human CPU rescues frozen Human Player');",
                  "await click(1190, 622);",
                  "harness.assert(pvar('Role') === 'Wolf', 'Player switches back to Wolf');",
                  "harness.assert(actors().every(a => avar(a.id, 'Role') === 'Human' && avar(a.id, 'State') === 'Active'), 'all Actors restored to Human/Active');",
                  "",
              ],
          }
          data.setdefault("tests", []).append(new_test)

          path.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          print("Applied clean ICE WOLF v0.6.0 Human-Side Playability")
          PY

      - name: Static JSON JavaScript and invariant validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool game.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('game.json').read_text(encoding='utf-8'))
          scene = next(x for x in data['layouts'] if x.get('name') == 'FROST LAB')
          actors = [x for x in scene['instances'] if x.get('name') == 'Actor']
          assert len(actors) == 6

          vars_by_name = {v['name']: v for v in scene['variables']}
          assert vars_by_name['MatchDuration']['value'] == 210
          assert vars_by_name['MatchTimeLeft']['value'] == 210
          assert vars_by_name['WolfCooldown']['value'] == 5
          assert vars_by_name['WolfModeDuration']['value'] == 5

          objects = {o['name']: o for o in scene['objects']}
          assert objects['BuildText']['string'] == '開発版 v0.6.0'
          assert objects['BuildText']['content']['text'] == '開発版 v0.6.0'
          assert objects['TimerText']['string'] == '3:30'
          assert objects['TimerText']['content']['text'] == '3:30'

          player = next(x for x in scene['instances'] if x.get('name') == 'Player')
          assert (player['width'], player['height'], player['depth']) == (17, 17, 32)
          for actor in actors:
              assert (actor['width'], actor['height'], actor['depth']) == (17, 17, 32)

          serialized = Path('game.json').read_text(encoding='utf-8')
          protected = [
              'FrozenWolfCandidate', '0x0077ff', '0x8b0000',
              'AIWolfModeLeft', 'AIWolfCooldownLeft',
              '感染させた（正体は秘密）', '人狼の勝利', '人間の勝利',
              'freeze_crack.wav', '__iceWolfPrimaryCPUWolf',
              "playerStateNow === 'Frozen'", 'v0.6.0 human-side CPU Wolf test',
          ]
          for token in protected:
              assert token in serialized, token

          # Extract the new role setup JS and main CPU AI JS for syntax checking.
          wolf_actions = next(e for e in scene['events'] if e.get('name') == 'Wolf actions')
          role_toggle = next(e for e in wolf_actions['events'] if any(
              c.get('type', {}).get('value') == 'ButtonStates::ButtonFSM::IsClicked' and c.get('parameters', [None])[0] == 'TestRoleButton'
              for c in e.get('conditions', [])
          ))
          role_js = next(e for e in role_toggle['events'] if e.get('type') == 'BuiltinCommonInstructions::JsCode' and any('__iceWolfPrimaryCPUWolf' in line for line in e.get('inlineCode', [])))
          Path('/tmp/v060-role.js').write_text('\n'.join(role_js['inlineCode']), encoding='utf-8')

          ai_group = next(e for e in scene['events'] if e.get('name') == 'v0.5.2 CPU5 Rescue AI + Repeat Wolf Cycle')
          ai_js = next(e for e in ai_group['events'] if e.get('type') == 'BuiltinCommonInstructions::JsCode')
          Path('/tmp/v060-ai.js').write_text('\n'.join(ai_js['inlineCode']), encoding='utf-8')

          test = next(t for t in data['tests'] if t.get('name') == 'v0.6.0 human-side CPU Wolf test')
          assert test['lastRunStatus'] == 'not-run'
          test_text = '\n'.join(test['source'])
          for token in [
              "wolfActors.length === 1",
              "humanActors.length === 5",
              "pvar('State') === 'Frozen'",
              "pvar('State') === 'Active'",
              "pvar('Role') === 'Wolf'",
          ]:
              assert token in test_text, token
          Path('/tmp/v060-test.mjs').write_text(test_text, encoding='utf-8')

          step2 = next(t for t in data['tests'] if t.get('name') == 'STEP2 core test')
          step2_text = '\n'.join(step2['source'])
          assert "actors().length === 6" in step2_text
          assert "ttxt.text === '3:30' || ttxt.text === '3:29'" in step2_text
          assert "for (let i = 0; i < 5; i++)" in step2_text
          assert "const last = actors()[5]" in step2_text
          assert step2['lastRunStatus'] == 'not-run'
          print('v0.6.0 structural invariants PASS')
          PY
          node --check /tmp/v060-role.js
          node --check /tmp/v060-ai.js
          node --check /tmp/v060-test.mjs

      - name: Commit game.json and remove one-time helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.json
          git rm .github/workflows/apply-v060-human-side-playability.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/apply-v060-human-side-playability.yml\ngame.json'
          git commit -m 'feat: add clean v0.6.0 human-side CPU Wolf playability'
          git push origin HEAD:feature/v060-human-side-playability
