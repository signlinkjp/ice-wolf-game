name: Apply v0.5.4 Second Wolf Movement Fix

on:
  push:
    paths:
      - '.github/workflows/apply-v054-second-wolf-movement-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.5.4 branch
        uses: actions/checkout@v4
        with:
          ref: feature/v054-second-wolf-movement-fix

      - name: Snapshot pre-change game
        run: cp game.json /tmp/game-before.json

      - name: Apply v0.5.4 movement fix
        run: python3 scripts/apply_v054_second_wolf_movement_fix.py

      - name: Validate isolated movement change
        run: |
          python3 -m json.tool game.json >/dev/null
          python3 - <<'PY'
          import copy, json
          before=json.load(open('/tmp/game-before.json',encoding='utf-8'))
          after=json.load(open('game.json',encoding='utf-8'))

          bf=next(x for x in before['layouts'] if x.get('name')=='FROST LAB')
          af=next(x for x in after['layouts'] if x.get('name')=='FROST LAB')
          bb=next(o for o in bf['objects'] if o.get('name')=='BuildText')
          ab=next(o for o in af['objects'] if o.get('name')=='BuildText')
          assert bb['string']=='DEV v0.5.3' and ab['string']=='DEV v0.5.4'
          assert bb['content']['text']=='DEV v0.5.3' and ab['content']['text']=='DEV v0.5.4'

          bg=next(e for e in bf['events'] if e.get('name')=='v0.5.2 CPU5 Rescue AI + Repeat Wolf Cycle')
          ag=next(e for e in af['events'] if e.get('name')=='v0.5.2 CPU5 Rescue AI + Repeat Wolf Cycle')
          bjs=next(e for e in bg['events'] if e.get('type')=='BuiltinCommonInstructions::JsCode')
          ajs=next(e for e in ag['events'] if e.get('type')=='BuiltinCommonInstructions::JsCode')
          bcode='\n'.join(bjs['inlineCode'])
          acode='\n'.join(ajs['inlineCode'])

          # Existing v0.5.3 AI must remain in order; v0.5.4 only inserts recovery logic.
          pos=0
          for line in bjs['inlineCode']:
            while pos < len(ajs['inlineCode']) and ajs['inlineCode'][pos] != line:
              pos += 1
            assert pos < len(ajs['inlineCode']), f'original AI line missing: {line}'
            pos += 1

          for token in [
            'aiWolfBlockedRatio = 0.28',
            'aiWolfBlockedTrigger = 0.14',
            'aiWolfDetourDuration = 0.75',
            '__iceWolfAIWolfPrevActualX',
            '__iceWolfAIWolfBlockedFor',
            '__iceWolfAIWolfDetourSign',
            'fx * 0.35 + (-fy * sign) * 0.95',
            'wolf.__iceWolfAIWolfLastExpectedMove = Math.max(0, speed * dt)',
          ]:
            assert token in acode, token

          # Protected gameplay invariants.
          actors=[i for i in af['instances'] if i.get('name')=='Actor']
          players=[i for i in af['instances'] if i.get('name')=='Player']
          assert len(actors)==6 and len(players)==1
          assert all((a['width'],a['height'],a['depth'])==(17,17,32) for a in actors)
          assert (players[0]['width'],players[0]['height'],players[0]['depth'])==(17,17,32)
          sv={v['name']:v for v in af.get('variables',[])}
          assert sv['MatchDuration']['value']==210 and sv['MatchTimeLeft']['value']==210
          assert sv['WolfModeDuration']['value']==5 and sv['WolfCooldown']['value']==5
          for token in [
            'aiWolfChaseSpeed = 205',
            'aiWolfStalkSpeed = 90',
            'aiWolfCooldownDuration = 5',
            "targetVars.get('Role').setString('Wolf')",
            "actorVars.get('State').setString('Frozen')",
          ]:
            assert token in acode, token
          assert 'InfectionUsed' not in acode

          vg=next(e for e in af['events'] if e.get('name')=='v0.3.4 guaranteed solid-state visuals')
          vjs=next(e for e in vg['events'] if e.get('type')=='BuiltinCommonInstructions::JsCode')
          vcode='\n'.join(vjs['inlineCode'])
          assert '0x0077ff' in vcode and '0x8b0000' in vcode
          assert "state === 'Frozen' || state === 'FrozenWolfCandidate'" in vcode

          raw=json.dumps(after,ensure_ascii=False,separators=(',',':'))
          for token in ['FrozenWolfCandidate','InfectionUsed','freeze_crack.wav','TRAP! YOU ARE FROZEN','255;0;0']:
            assert token in raw, token

          # Prove nothing outside BuildText + this one AI inlineCode changed.
          normalized=copy.deepcopy(after)
          nf=next(x for x in normalized['layouts'] if x.get('name')=='FROST LAB')
          nb=next(o for o in nf['objects'] if o.get('name')=='BuildText')
          nb['string']=bb['string']
          nb['content']['text']=bb['content']['text']
          ng=next(e for e in nf['events'] if e.get('name')=='v0.5.2 CPU5 Rescue AI + Repeat Wolf Cycle')
          njs=next(e for e in ng['events'] if e.get('type')=='BuiltinCommonInstructions::JsCode')
          njs['inlineCode']=bjs['inlineCode']
          assert normalized==before, 'unexpected changes outside BuildText/second-Wolf AI JS'

          print('v0.5.4 static validation PASS: isolated second-Wolf stuck recovery')
          PY

      - name: Commit game.json
        run: |
          if git diff --quiet -- game.json; then
            echo 'No game.json changes detected'; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.json
          git commit -m 'fix: v0.5.4 recover awakened Wolf from wall stalls'
          git push origin HEAD:feature/v054-second-wolf-movement-fix
