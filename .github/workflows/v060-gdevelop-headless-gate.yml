name: v0.6.0 GDevelop Headless Gate

on:
  push:
    branches:
      - feature/v060-human-side-cpu-wolf
    paths:
      - '.github/workflows/v060-gdevelop-headless-gate.yml'

permissions:
  contents: read

jobs:
  gameplay-and-build-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v060-human-side-cpu-wolf
          fetch-depth: 0

      - name: Confirm expected feature and baseline versions
        shell: bash
        run: |
          test "$(git rev-parse 84bbfe11f8f345addf3762cc277429b560cc4194)" = '84bbfe11f8f345addf3762cc277429b560cc4194'
          python - <<'PY'
          import json
          with open('game.json', encoding='utf-8') as f:
              data = json.load(f)
          gd = data['gdVersion']
          assert (gd['major'], gd['minor'], gd['build']) == (5, 6, 282), gd
          frost = next(x for x in data['layouts'] if x.get('name') == 'FROST LAB')
          build = next(x for x in frost['objects'] if x.get('name') == 'BuildText')
          assert build['string'] == '開発版 v0.6.0'
          print('Feature version gate PASS: GDevelop 5.6.282 / ICE WOLF v0.6.0')
          PY
          git show 84bbfe11f8f345addf3762cc277429b560cc4194:game.json > main-baseline.json
          python -m json.tool main-baseline.json > /dev/null

      - name: Install GDevelop Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libasound2t64 xvfb unzip curl

      - name: Download exact GDevelop 5.6.282 portable build
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            'https://github.com/4ian/GDevelop/releases/download/v5.6.282/GDevelop-5-5.6.282-linux.zip' \
            --output /tmp/gdevelop.zip
          echo 'c1d23616562befbde242412913785dacb0bb15a79e8c101c1553dc729b1e0472  /tmp/gdevelop.zip' | sha256sum -c -
          mkdir -p /tmp/gdevelop
          unzip -q /tmp/gdevelop.zip -d /tmp/gdevelop
          BIN="$(find /tmp/gdevelop -type f -name gdevelop -perm -u+x | head -n 1)"
          if [ -z "$BIN" ]; then
            BIN="$(find /tmp/gdevelop -type f -name gdevelop | head -n 1)"
          fi
          test -n "$BIN"
          chmod +x "$BIN"
          echo "GDEVELOP_BIN=$BIN" >> "$GITHUB_ENV"
          echo "GDevelop binary: $BIN"

      - name: Run v0.6.0 targeted gameplay test in GDevelop
        shell: bash
        run: |
          xvfb-run -a "$GDEVELOP_BIN" \
            --no-sandbox \
            --disable-update-check \
            --run-command RUN_ALL_TESTS "$GITHUB_WORKSPACE/game.json" \
            --cmd-args 'v0.6.0 human-side CPU Wolf test' \
            --results-path "$GITHUB_WORKSPACE/gameplay-test-results.json"
          test -s gameplay-test-results.json

      - name: Prove strict diagnostic count is inherited from exact main
        shell: bash
        run: |
          rm -rf build
          set +e
          xvfb-run -a "$GDEVELOP_BIN" \
            --no-sandbox \
            --disable-update-check \
            --block-on-diagnostic-errors \
            --run-command EXPORT_HTML5_EXTERNAL "$GITHUB_WORKSPACE/game.json" \
            > feature-strict.log 2>&1
          FEATURE_STATUS=$?
          set -e
          cat feature-strict.log
          test "$FEATURE_STATUS" -ne 0
          grep -Fq '[CLI] Diagnostic report has 14 error(s). Export blocked.' feature-strict.log

          rm -rf build
          set +e
          xvfb-run -a "$GDEVELOP_BIN" \
            --no-sandbox \
            --disable-update-check \
            --block-on-diagnostic-errors \
            --run-command EXPORT_HTML5_EXTERNAL "$GITHUB_WORKSPACE/main-baseline.json" \
            > baseline-strict.log 2>&1
          BASELINE_STATUS=$?
          set -e
          cat baseline-strict.log
          test "$BASELINE_STATUS" -ne 0
          grep -Fq '[CLI] Diagnostic report has 14 error(s). Export blocked.' baseline-strict.log

          echo 'Strict diagnostic provenance PASS: feature=14, exact main baseline=14.'

      - name: Export v0.6.0 HTML5 using standard GDevelop export
        shell: bash
        run: |
          rm -rf build
          xvfb-run -a "$GDEVELOP_BIN" \
            --no-sandbox \
            --disable-update-check \
            --run-command EXPORT_HTML5_EXTERNAL "$GITHUB_WORKSPACE/game.json"
          test -s build/index.html
          FILE_COUNT="$(find build -type f | wc -l)"
          test "$FILE_COUNT" -gt 5
          echo "HTML5 standard export PASS: $FILE_COUNT files"
