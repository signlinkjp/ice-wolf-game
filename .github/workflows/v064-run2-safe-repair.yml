name: v0.6.4 Run 2 Safe Audit Repair

on:
  push:
    branches:
      - feature/v064-compact-joystick-overview-camera
    paths:
      - '.github/v064-run2-repair-trigger'

permissions:
  contents: write

jobs:
  repair-audit-gate-only:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v064-compact-joystick-overview-camera
          fetch-depth: 0

      - name: Guard canonical refs and untouched game
        shell: bash
        run: |
          set -euo pipefail
          MAIN='45024fa159bd66291a4687c74eb29f5896b35392'
          PARENT='a08d5301b3fecf98900946354f046841910ff936'
          GAME_BLOB='73dc5913c07813b3858acbbe456f2e5af380282c'
          git fetch origin main feature/v063-mobile-virtual-joystick --no-tags
          test "$(git rev-parse origin/main)" = "$MAIN"
          test "$(git rev-parse origin/feature/v063-mobile-virtual-joystick)" = "$PARENT"
          test "$(git merge-base "$MAIN" HEAD)" = "$MAIN"
          test "$(git hash-object game.json)" = "$GAME_BLOB"
          git diff --quiet "$PARENT" -- game.json
          ACTUAL="$(git diff --name-only "$PARENT"..HEAD | sort)"
          EXPECTED="$(printf '%s\n' \
            '.github/v064-run2-repair-trigger' \
            '.github/workflows/v064-audit-fix.yml' \
            '.github/workflows/v064-compact-joystick-overview-camera.yml' \
            '.github/workflows/v064-run2-audit-correction.yml' \
            '.github/workflows/v064-run2-audit-fix.yml' \
            '.github/workflows/v064-run2-safe-repair.yml' | sort)"
          test "$ACTUAL" = "$EXPECTED"
          echo 'Repair preflight PASS: only approved audit helpers/gate differ; game.json and main are untouched.'

      - name: Patch only stale gate bookkeeping by line identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/v064-compact-joystick-overview-camera.yml')
          lines = p.read_text(encoding='utf-8').splitlines(keepends=True)

          def unique_index(predicate, label):
              matches = [i for i, line in enumerate(lines) if predicate(line, i)]
              assert len(matches) == 1, (label, matches)
              return matches[0]

          # READ/VERIFY only: the comparator is already semantically correct.
          message = "joystick changed outside approved visual-only edits"
          comparator = unique_index(lambda line, _: message in line, 'joystick comparator')
          assert lines[comparator].strip() == "assert actual == expected, 'joystick changed outside approved visual-only edits'"
          context = ''.join(lines[max(0, comparator - 40):comparator])
          assert "bj = copy.deepcopy(event(b,'v0.6.3 Mobile Virtual Joystick UI'))" in context
          assert "actual = copy.deepcopy(event(a,'v0.6.4 Compact Mobile Virtual Joystick UI'))" in context
          assert "expected = copy.deepcopy(bj)" in context
          assert "expected['events'][0]['inlineCode'] = expected_code.split('\\n')" in context

          # The only stale provenance assumption is that HEAD must be the first
          # child of v0.6.3. Remove that exact line after proving uniqueness.
          stale_guard = 'test "$(git rev-parse HEAD^)" = "$PARENT"'
          guard = unique_index(lambda line, _: line.strip() == stale_guard, 'stale HEAD^ guard')
          del lines[guard]

          # Add a separate user-authored trigger for the corrected canonical gate.
          trigger_anchor = "- '.github/workflows/v064-compact-joystick-overview-camera.yml'"
          early = [i for i, line in enumerate(lines[:20]) if line.strip() == trigger_anchor]
          assert len(early) == 1, ('canonical push path anchor', early)
          lines.insert(early[0] + 1, "      - '.github/v064-run2-trigger'\n")

          # Net-delta guard: after helper cleanup only gate + trigger may remain.
          actual_line = unique_index(
              lambda line, _: line.strip() == 'ACTUAL="$(git diff --name-only "$PARENT"..HEAD)"',
              'initial ACTUAL guard',
          )
          indent = lines[actual_line][:len(lines[actual_line]) - len(lines[actual_line].lstrip())]
          lines[actual_line] = indent + 'ACTUAL="$(git diff --name-only "$PARENT"..HEAD | sort)"\n'
          old_test = 'test "$ACTUAL" = \'.github/workflows/v064-compact-joystick-overview-camera.yml\''
          test_line = unique_index(lambda line, _: line.strip() == old_test, 'initial exact-file guard')
          test_indent = lines[test_line][:len(lines[test_line]) - len(lines[test_line].lstrip())]
          lines[test_line:test_line + 1] = [
              test_indent + 'EXPECTED="$(printf \'%s\\n\' \'.github/v064-run2-trigger\' \'.github/workflows/v064-compact-joystick-overview-camera.yml\' | sort)"\n',
              test_indent + 'test "$ACTUAL" = "$EXPECTED"\n',
          ]

          # Final successful gate self-cleans both its workflow and trigger.
          rm_line = unique_index(
              lambda line, _: line.strip() == 'git rm .github/workflows/v064-compact-joystick-overview-camera.yml',
              'final gate self-clean',
          )
          rm_indent = lines[rm_line][:len(lines[rm_line]) - len(lines[rm_line].lstrip())]
          lines[rm_line] = rm_indent + 'git rm .github/workflows/v064-compact-joystick-overview-camera.yml .github/v064-run2-trigger\n'

          stage_old = 'EXPECTED="$(printf \'%s\\n\' \'.github/workflows/v064-compact-joystick-overview-camera.yml\' \'game.json\' | sort)"'
          stage_line = unique_index(lambda line, _: line.strip() == stage_old, 'final staged-file guard')
          stage_indent = lines[stage_line][:len(lines[stage_line]) - len(lines[stage_line].lstrip())]
          lines[stage_line] = stage_indent + 'EXPECTED="$(printf \'%s\\n\' \'.github/v064-run2-trigger\' \'.github/workflows/v064-compact-joystick-overview-camera.yml\' \'game.json\' | sort)"\n'

          gone_line = unique_index(
              lambda line, _: line.strip() == 'test ! -e .github/workflows/v064-compact-joystick-overview-camera.yml',
              'final gate absence guard',
          )
          gone_indent = lines[gone_line][:len(lines[gone_line]) - len(lines[gone_line].lstrip())]
          lines.insert(gone_line + 1, gone_indent + 'test ! -e .github/v064-run2-trigger\n')

          p.write_text(''.join(lines), encoding='utf-8')
          print('Canonical gate repaired without whole-block string replacement; comparator left unchanged.')
          PY
          git diff --check
          test "$(git hash-object game.json)" = '73dc5913c07813b3858acbbe456f2e5af380282c'
          git diff --quiet a08d5301b3fecf98900946354f046841910ff936 -- game.json

      - name: Stage canonical trigger and self-clean all audit helpers
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'v0.6.4 Run 2 canonical gate armed; edit this file once as the user to execute.' > .github/v064-run2-trigger
          git rm .github/v064-run2-repair-trigger
          git rm .github/workflows/v064-audit-fix.yml
          git rm .github/workflows/v064-run2-audit-correction.yml
          git rm .github/workflows/v064-run2-audit-fix.yml
          git rm .github/workflows/v064-run2-safe-repair.yml
          git add .github/workflows/v064-compact-joystick-overview-camera.yml .github/v064-run2-trigger
          test "$(git hash-object game.json)" = '73dc5913c07813b3858acbbe456f2e5af380282c'
          git diff --cached --quiet -- game.json
          STAGED="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n' \
            '.github/v064-run2-repair-trigger' \
            '.github/v064-run2-trigger' \
            '.github/workflows/v064-audit-fix.yml' \
            '.github/workflows/v064-compact-joystick-overview-camera.yml' \
            '.github/workflows/v064-run2-audit-correction.yml' \
            '.github/workflows/v064-run2-audit-fix.yml' \
            '.github/workflows/v064-run2-safe-repair.yml' | sort)"
          test "$STAGED" = "$EXPECTED"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: safely repair v0.6.4 Run 2 gate [skip ci]'
          git push origin HEAD:feature/v064-compact-joystick-overview-camera

          PARENT='a08d5301b3fecf98900946354f046841910ff936'
          NET="$(git diff --name-only "$PARENT"..HEAD | sort)"
          EXPECTED_NET="$(printf '%s\n' '.github/v064-run2-trigger' '.github/workflows/v064-compact-joystick-overview-camera.yml' | sort)"
          test "$NET" = "$EXPECTED_NET"
          test "$(git hash-object game.json)" = '73dc5913c07813b3858acbbe456f2e5af380282c'
          echo 'SAFE REPAIR COMPLETE: canonical gate is armed but not user-triggered by this helper.'
