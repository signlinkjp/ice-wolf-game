# ============================================================
# ICE WOLF — iOS TestFlight（Three.js 版 / Build 35）
#
# ★ これは「貼り替え用」のワークフローです（トモアキさんの権限境界）。
#   GitHub 連携の権限では .github/workflows/ を直接更新できないため、
#   このファイルの中身をそのままコピーして
#     .github/workflows/ios-testflight.yml
#   を上書きしてください。貼り替えるまでは、既存の GDevelop 版
#   ワークフローは game.json を探して止まります（古いビルドが
#   TestFlight に出ることはありません）。
#
# 何をするか:
#   npm ci → npm test → npm run build（www/ 生成）
#   → npx cap sync ios（www/ → ios/App/App/public）
#   → Supabase の online config を index.html に注入
#   → scripts/ios/verify-ios-project.py でシェル検証
#   → xcodebuild archive / -exportArchive → altool で TestFlight
#
# ビルド番号・表示バージョンは pbxproj から読みます（固定値を書きません）。
# いまは MARKETING_VERSION = 1.2.0 / CURRENT_PROJECT_VERSION = 35。
# 次のビルドは pbxproj の CURRENT_PROJECT_VERSION を上げるだけで、
# このワークフローは書き換え不要です。
#
# 必要な Secrets（既存リポジトリと同じ値）:
#   APPLE_TEAM_ID                   … TGBNH8WJV6
#   APPSTORE_CONNECT_KEY_ID         … App Store Connect API キーの Key ID
#   APPSTORE_CONNECT_ISSUER_ID      … Issuer ID
#   APPSTORE_CONNECT_PRIVATE_KEY    … AuthKey_*.p8 の中身
#   （ASC_API_KEY_ID / ASC_API_ISSUER_ID / ASC_API_KEY_P8 でも可）
#   任意: ICEWOLF_SUPABASE_URL / ICEWOLF_SUPABASE_ANON_KEY
#         （未設定なら本番 games-realtime が使われます）
#
# ※ 1行目は必ず「# 」で始まる YAML コメントのままにしてください。
# ============================================================
name: ICE WOLF iOS TestFlight (Three.js)

on:
  workflow_dispatch:
    inputs:
      confirm_bundle_id:
        description: "確認のため bundle ID を入力: jp.signlink.IceWolf"
        required: true
        type: string
        default: "jp.signlink.IceWolf"
      upload_to_testflight:
        description: "TestFlight へアップロードする（false = 署名済みIPAの作成まで）"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ice-wolf-ios-testflight
  cancel-in-progress: false

env:
  BUNDLE_ID: jp.signlink.IceWolf
  PBXPROJ: ios/App/App.xcodeproj/project.pbxproj

jobs:
  preflight:
    name: Web preflight（テスト・ビルド・シェル検証）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Confirm run intent
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm_bundle_id }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = "$BUNDLE_ID"

      - name: Read the version from the iOS project
        run: |
          set -euo pipefail
          BUILD_NUMBER=$(grep -m1 -E 'CURRENT_PROJECT_VERSION = [0-9]+;' "$PBXPROJ" | sed -E 's/.*CURRENT_PROJECT_VERSION = ([0-9]+);.*/\1/')
          MARKETING_VERSION=$(grep -m1 -E 'MARKETING_VERSION = [0-9.]+;' "$PBXPROJ" | sed -E 's/.*MARKETING_VERSION = ([0-9.]+);.*/\1/')
          test -n "$BUILD_NUMBER" || { echo "::error::pbxproj に CURRENT_PROJECT_VERSION がありません"; exit 1; }
          test -n "$MARKETING_VERSION" || { echo "::error::pbxproj に MARKETING_VERSION がありません"; exit 1; }
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"
          echo "ビルド番号: $BUILD_NUMBER / 表示バージョン: $MARKETING_VERSION"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests (rules, stages, i18n, online)
        run: npm test

      - name: Build the web layer
        run: npm run build

      - name: Guard the built game
        run: |
          set -euo pipefail
          test -f www/index.html
          test -f www/src/main.js
          test -f www/src/core/rules.js
          test -f www/vendor/three.module.js
          test -f www/assets/ice_freeze.png
          grep -q 'src/main.js' www/index.html
          grep -q "ice-wolf-room-" www/src/online.js
          grep -q 'IceWolfStoreKit' www/src/iap.js
          grep -q 'jp.signlink.IceWolf.pro' www/src/config.js
          grep -q 'data-controls' www/styles.css
          ! grep -q 'gdevelop' www/index.html
          echo "web build OK (build $BUILD_NUMBER)"

      - name: Verify the iOS shell
        run: python3 scripts/ios/verify-ios-project.py --build-dir www

      - name: Guard the iOS project contract
        run: |
          set -euo pipefail
          test -f ios/App/App/Info.plist
          test -f ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          test -f ios/App/App/StoreKitPlugin.swift
          test -f ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = jp.signlink.IceWolf;' "$PBXPROJ"
          grep -q "CURRENT_PROJECT_VERSION = $BUILD_NUMBER;" "$PBXPROJ"
          grep -q 'webDir: "www"' capacitor.config.ts
          python3 - <<'PY'
          import os, plistlib, pathlib, re
          plist = plistlib.loads(pathlib.Path('ios/App/App/Info.plist').read_bytes())
          assert plist['CFBundleDisplayName'] == 'ICE WOLF', plist['CFBundleDisplayName']
          pbx = pathlib.Path(os.environ['PBXPROJ']).read_text()
          numbers = [int(n) for n in re.findall(r'CURRENT_PROJECT_VERSION = (\d+);', pbx)]
          assert len(numbers) == 2, f'ビルド番号は2箇所（Debug/Release）: {numbers}'
          assert len(set(numbers)) == 1, f'2箇所のビルド番号が違います: {numbers}'
          assert numbers[0] == int(os.environ['BUILD_NUMBER']), 'pbxproj と解決したビルド番号が違います'
          assert re.search(r'MARKETING_VERSION = 1\.2\.0;', pbx), 'MARKETING_VERSION が 1.2.0 でない'
          print('iOS project contract OK (build %s)' % os.environ['BUILD_NUMBER'])
          PY

  testflight:
    name: Xcode で署名 → IPA → TestFlight
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID || secrets.ASC_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID || secrets.ASC_API_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY || secrets.ASC_API_KEY_P8 }}
      UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the iOS project
        shell: bash
        run: |
          set -euo pipefail
          BUILD_NUMBER=$(grep -m1 -E 'CURRENT_PROJECT_VERSION = [0-9]+;' "$PBXPROJ" | sed -E 's/.*CURRENT_PROJECT_VERSION = ([0-9]+);.*/\1/')
          MARKETING_VERSION=$(grep -m1 -E 'MARKETING_VERSION = [0-9.]+;' "$PBXPROJ" | sed -E 's/.*MARKETING_VERSION = ([0-9.]+);.*/\1/')
          test -n "$BUILD_NUMBER"
          test -n "$MARKETING_VERSION"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"
          echo "ビルド番号: $BUILD_NUMBER / 表示バージョン: $MARKETING_VERSION"

      - name: Verify Apple secret contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TEAM_ID" || { echo "::error::APPLE_TEAM_ID が未設定です"; exit 1; }
          test -n "$ASC_KEY_ID" || { echo "::error::APPSTORE_CONNECT_KEY_ID（または ASC_API_KEY_ID）が未設定です"; exit 1; }
          test -n "$ASC_ISSUER_ID" || { echo "::error::APPSTORE_CONNECT_ISSUER_ID（または ASC_API_ISSUER_ID）が未設定です"; exit 1; }
          test -n "$ASC_PRIVATE_KEY" || { echo "::error::APPSTORE_CONNECT_PRIVATE_KEY（または ASC_API_KEY_P8）が未設定です"; exit 1; }
          echo "Secrets present."

      - name: Xcode environment
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Write the App Store Connect key
        shell: bash
        run: |
          set -euo pipefail
          AUTH_KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          export AUTH_KEY_PATH
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ["ASC_PRIVATE_KEY"]
          value = value.lstrip("\ufeff").replace("\r\n", "\n").replace("\r", "\n").strip()
          if len(value) >= 2 and value[0] == value[-1] and value[0] in {'"', "'"}:
              value = value[1:-1].strip()
          if "\\n" in value and "\n" not in value:
              value = value.replace("\\n", "\n")
          if "-----BEGIN" not in value:
              try:
                  decoded = base64.b64decode("".join(value.split()), validate=True).decode("utf-8")
                  if "-----BEGIN" in decoded:
                      value = decoded.strip()
              except Exception:
                  pass
          Path(os.environ["AUTH_KEY_PATH"]).write_text(value + "\n", encoding="utf-8")
          PY
          chmod 600 "$AUTH_KEY_PATH"
          if ! openssl pkey -in "$AUTH_KEY_PATH" -noout >/dev/null 2>&1; then
            echo "::error::ASC_PRIVATE_KEY が正しい .p8（PEM秘密鍵）ではありません。AuthKey_*.p8 の中身を丸ごとコピーしてください。"
            exit 1
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$AUTH_KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "AUTH_KEY_PATH=$AUTH_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build the web layer and sync Capacitor
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          npx cap sync ios
          test -f ios/App/App/public/index.html
          test -f ios/App/App/public/src/main.js
          test -f ios/App/App/public/vendor/three.module.js
          test -f ios/App/App/public/assets/ice_freeze.png
          echo "Capacitor sync OK"

      - name: Inject the online project
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ios/inject-online-config.py --file ios/App/App/public/index.html
          python3 scripts/ios/verify-ios-project.py \
            --build-dir www \
            --public-dir ios/App/App/public \
            --require-online-config

      - name: Archive (Xcode cloud signing)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/release/ICEWOLF.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            clean archive | tee build/release/archive.log

      - name: Export App Store Connect IPA
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/release/ICEWOLF.xcarchive" \
            -exportPath "$PWD/build/release/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee build/release/export.log
          IPA_PATH=$(find "$PWD/build/release/export" -maxdepth 1 -name "*.ipa" -print -quit)
          test -n "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          shasum -a 256 "$IPA_PATH" | tee build/release/IPA_SHA256.txt

      - name: Validate the IPA with App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool --validate-app -f "$IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            --output-format json | tee build/release/altool-validate.json

      - name: Upload to TestFlight
        if: ${{ env.UPLOAD == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            --output-format json | tee build/release/altool-upload.json

      - name: Keep the build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icewolf-threejs-testflight-evidence
          path: |
            build/release/*.log
            build/release/*.json
            build/release/IPA_SHA256.txt
          if-no-files-found: warn
          retention-days: 30
